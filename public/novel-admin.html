<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<script src="/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>จัดการนิยาย | nivread</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif}</style>
</head>
<body class="bg-[#f3f4f6] text-slate-900 dark:bg-[#0d0d0d] dark:text-white min-h-screen flex flex-col relative overflow-x-hidden">
<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
  <div class="absolute top-1/2 -right-40 w-96 h-96 bg-orange-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
</div>
<header id="main-header" class="z-20"></header>

<main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-6 z-10">
  <h1 class="text-3xl font-extrabold tracking-tight">จัดการนิยาย</h1>
  <p id="note" class="text-sm text-slate-600 dark:text-neutral-400 mt-1">สร้างนิยาย อัปโหลดปก และเพิ่มตอน</p>
  <div id="toast" class="text-sm font-medium min-h-[1.25rem] mt-3" role="status"></div>

  <!-- รายการนิยายของฉัน -->
  <section id="list-view" class="mt-4">
    <div class="flex items-center justify-between">
      <h2 class="font-bold">นิยายของฉัน</h2>
      <button id="new-novel" type="button" class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white text-sm font-semibold">+ นิยายใหม่</button>
    </div>
    <ul id="novel-list" class="mt-3 grid sm:grid-cols-2 gap-3"></ul>
  </section>

  <!-- แก้ไขนิยาย + ตอน -->
  <section id="edit-view" class="mt-4 hidden">
    <button id="back" type="button" class="text-sm text-slate-500 dark:text-neutral-400 hover:text-amber-500">← กลับไปรายการ</button>
    <div class="mt-3 grid md:grid-cols-[200px_1fr] gap-5">
      <div>
        <div id="cover-box" class="aspect-[2/3] w-full rounded-2xl overflow-hidden border border-slate-200 dark:border-white/10 bg-slate-200 dark:bg-white/5 flex items-center justify-center text-xs text-slate-500">ยังไม่มีปก</div>
        <input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
        <div class="mt-2 flex gap-2">
          <button id="cover-pick" type="button" class="flex-1 px-3 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm hover:border-amber-500">อัปโหลดปก</button>
          <button id="cover-del" type="button" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm hover:border-rose-500 hidden">ลบ</button>
        </div>
        <p class="text-[11px] text-slate-400 mt-1">ระบบครอปเป็นสัดส่วน 2:3 และบีบรูปให้อัตโนมัติ</p>
      </div>
      <form id="novel-form" class="rounded-2xl bg-white/85 dark:bg-white/5 border border-slate-200 dark:border-white/10 backdrop-blur-md p-4 space-y-3">
        <input id="n-title" maxlength="150" required placeholder="ชื่อเรื่อง" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500">
        <div class="grid grid-cols-2 gap-3">
          <input id="n-cat" maxlength="40" placeholder="หมวดหมู่ (เช่น แฟนตาซี)" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500">
          <input id="n-slug" maxlength="80" placeholder="slug (a-z 0-9 -) ว่าง = สุ่ม" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500">
          <select id="n-status" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm"><option value="ongoing">กำลังเขียน</option><option value="completed">จบแล้ว</option><option value="hiatus">พักการเขียน</option></select>
          <select id="n-vis" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm"><option value="draft">ฉบับร่าง (ซ่อน)</option><option value="public">เผยแพร่</option></select>
        </div>
        <textarea id="n-syn" rows="5" maxlength="3000" placeholder="เรื่องย่อ" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm leading-7 focus:outline-none focus:border-amber-500"></textarea>
        <div class="flex flex-wrap gap-2 items-center">
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white text-sm font-semibold">บันทึกนิยาย</button>
          <a id="view-link" href="#" target="_blank" rel="noopener" class="text-sm text-amber-600 dark:text-amber-400 hover:underline hidden">ดูหน้าเว็บ ↗</a>
          <button id="n-del" type="button" class="ml-auto px-4 py-2.5 rounded-xl border border-rose-400/60 text-rose-500 text-sm hidden">ลบนิยาย</button>
        </div>
      </form>
    </div>

    <div id="chapters-box" class="mt-8 hidden">
      <div class="flex items-center justify-between"><h2 class="font-bold">ตอนทั้งหมด</h2>
        <button id="new-ch" type="button" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm hover:border-amber-500">+ ตอนใหม่</button></div>
      <ul id="ch-list" class="mt-3 rounded-2xl border border-slate-200 dark:border-white/10 divide-y divide-slate-200 dark:divide-white/10 overflow-hidden bg-white/85 dark:bg-white/5"></ul>

      <form id="ch-form" class="mt-5 rounded-2xl bg-white/85 dark:bg-white/5 border border-slate-200 dark:border-white/10 backdrop-blur-md p-4 space-y-3">
        <h3 id="ch-h" class="font-semibold">ตอนใหม่</h3>
        <div class="grid grid-cols-3 gap-3">
          <input id="c-no" type="number" min="1" placeholder="เลขตอน (ว่าง = ต่อท้าย)" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm">
          <input id="c-price" type="number" min="0" max="1000" value="0" title="ราคา coin (0 = ฟรี)" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm">
          <select id="c-vis" class="px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm"><option value="draft">ฉบับร่าง</option><option value="public">เผยแพร่</option></select>
        </div>
        <p class="text-[11px] text-slate-400 -mt-1">ราคา = จำนวน coin (0 = อ่านฟรี) · เฉพาะแอดมินตั้งราคาได้</p>
        <input id="c-title" maxlength="150" required placeholder="ชื่อตอน" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500">
        <div class="flex justify-end text-xs text-slate-400"><span id="c-count">0 / 150000</span></div>
        <textarea id="c-body" rows="16" maxlength="150000" required placeholder="เนื้อหาตอน — ขึ้นบรรทัดใหม่ = ขึ้นย่อหน้าใหม่" class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm leading-7 focus:outline-none focus:border-amber-500"></textarea>
        <div class="flex gap-2 items-center">
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white text-sm font-semibold">บันทึกตอน</button>
          <button id="c-del" type="button" class="px-4 py-2.5 rounded-xl border border-rose-400/60 text-rose-500 text-sm hidden">ลบตอนนี้</button>
        </div>
      </form>
    </div>
  </section>
</main>

<div id="main-footer" class="z-10"></div>
<script src="/nivread.js"></script>
<script>
(() => {
  const { session, api, el } = NIV;
  const s = session();
  if (!s.token || !s.userId) { location.replace('/login?redirect=/novel-admin'); return; }
  const $ = (id) => document.getElementById(id);
  const enc = encodeURIComponent;
  const uid = s.userId;
  let novel = null;      // นิยายที่กำลังแก้ (null = สร้างใหม่)
  let chapter = null;    // ตอนที่กำลังแก้ (null = ตอนใหม่)

  const toast = (t, kind) => { const m = $('toast'); m.textContent = t || ''; m.className = 'text-sm font-medium min-h-[1.25rem] mt-3 ' + (kind === 'ok' ? 'text-emerald-600 dark:text-emerald-400' : kind === 'err' ? 'text-rose-600 dark:text-rose-400' : 'text-amber-600'); };
  const fail = (r, fb) => { if (r.status === 401) { toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่', 'err'); setTimeout(() => location.replace('/login?redirect=/novel-admin'), 1200); } else toast(r.data.error || fb, 'err'); };
  const view = (name) => { $('list-view').classList.toggle('hidden', name !== 'list'); $('edit-view').classList.toggle('hidden', name !== 'edit'); toast(''); };

  // ---------- รายการนิยาย ----------
  async function loadList() {
    const r = await api('/api/novel/mine?userId=' + enc(uid));
    if (!r.ok) return fail(r, 'โหลดรายการไม่สำเร็จ');
    $('new-novel').classList.toggle('hidden', !r.data.canWrite);
    if (!r.data.canWrite) $('note').textContent = 'บัญชีนี้ยังไม่ได้รับสิทธิ์ลงนิยาย';
    const ul = $('novel-list'); ul.replaceChildren();
    if (!r.data.novels.length) ul.append(el('li', 'text-sm text-slate-500 dark:text-neutral-400', 'ยังไม่มีนิยาย'));
    r.data.novels.forEach((n) => {
      const li = el('li', 'rounded-2xl bg-white/85 dark:bg-white/5 border border-slate-200 dark:border-white/10 p-4 flex gap-3 items-center cursor-pointer hover:border-amber-500/60');
      if (n.cover_url) { const im = el('img', 'w-12 h-[72px] rounded-lg object-cover shrink-0'); im.src = n.cover_url; im.alt = ''; li.append(im); }
      const box = el('div', 'min-w-0');
      box.append(el('p', 'font-semibold truncate', n.title), el('p', 'text-xs text-slate-500 dark:text-neutral-400', (n.visibility === 'public' ? 'เผยแพร่' : 'ฉบับร่าง') + ' · ' + n.total_chapters + ' ตอน'));
      li.append(box); li.addEventListener('click', () => openNovel(n)); ul.append(li);
    });
  }

  // ---------- ฟอร์มนิยาย ----------
  function fillNovel(n) {
    novel = n;
    $('n-title').value = n ? n.title : ''; $('n-cat').value = n ? n.category : ''; $('n-slug').value = n ? n.slug : '';
    $('n-status').value = n ? n.status : 'ongoing'; $('n-vis').value = n ? n.visibility : 'draft'; $('n-syn').value = n ? n.synopsis : '';
    $('n-del').classList.toggle('hidden', !n); $('chapters-box').classList.toggle('hidden', !n);
    const v = $('view-link'); v.classList.toggle('hidden', !n); if (n) v.href = '/novels/' + enc(n.slug);
    paintCover();
  }
  function paintCover() {
    const box = $('cover-box'); box.replaceChildren();
    if (novel && novel.cover_url) { const im = el('img', 'w-full h-full object-cover'); im.src = novel.cover_url + '?t=' + Date.now(); im.alt = 'ปกนิยาย'; box.append(im); }
    else box.textContent = novel ? 'ยังไม่มีปก' : 'บันทึกนิยายก่อนจึงจะอัปโหลดปกได้';
    $('cover-del').classList.toggle('hidden', !(novel && novel.cover_url));
  }
  function openNovel(n) { fillNovel(n); view('edit'); if (n) loadChapters(); }

  $('new-novel').onclick = () => { fillNovel(null); view('edit'); };
  $('back').onclick = () => { view('list'); loadList(); };

  $('novel-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = { userId: uid, title: $('n-title').value, category: $('n-cat').value, status: $('n-status').value, visibility: $('n-vis').value, synopsis: $('n-syn').value, slug: $('n-slug').value.trim() || undefined };
    const r = novel ? await api('/api/novel/update', { method: 'POST', body: { ...body, id: novel.id } }) : await api('/api/novel/create', { method: 'POST', body });
    if (!r.ok) return fail(r, 'บันทึกไม่สำเร็จ');
    toast('บันทึกแล้ว', 'ok');
    const mine = await api('/api/novel/mine?userId=' + enc(uid));
    const fresh = mine.ok && mine.data.novels.find((n) => n.slug === r.data.slug);
    if (fresh) openNovel(fresh);
  });

  $('n-del').onclick = async () => {
    if (!novel || !confirm('ลบนิยาย "' + novel.title + '" และทุกตอนถาวร?')) return;
    const r = await api('/api/novel/delete', { method: 'POST', body: { userId: uid, id: novel.id } });
    if (!r.ok) return fail(r, 'ลบไม่สำเร็จ');
    view('list'); loadList(); toast('ลบนิยายแล้ว', 'ok');
  };

  // ---------- ภาพปก: ครอป 2:3 + บีบเป็น WebP ในเบราว์เซอร์ ----------
  async function makeCover(file) {
    const bmp = await createImageBitmap(file);
    const W = 600, H = 900, c = document.createElement('canvas'); c.width = W; c.height = H;
    const k = Math.max(W / bmp.width, H / bmp.height);
    c.getContext('2d').drawImage(bmp, (W - bmp.width * k) / 2, (H - bmp.height * k) / 2, bmp.width * k, bmp.height * k);
    const to = (type, q) => new Promise((res) => c.toBlob(res, type, q));
    let blob = await to('image/webp', 0.85);
    if (!blob || blob.type !== 'image/webp') blob = await to('image/jpeg', 0.85);
    return blob;
  }
  $('cover-pick').onclick = () => { if (!novel) return toast('บันทึกนิยายก่อนจึงจะอัปโหลดปกได้', 'err'); $('cover-file').click(); };
  $('cover-file').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f || !novel) return;
    toast('กำลังอัปโหลด…');
    let blob; try { blob = await makeCover(f); } catch { return toast('อ่านรูปนี้ไม่ได้ ลองไฟล์ JPG / PNG / WebP', 'err'); }
    const res = await fetch(NIV.API + '/api/novel/cover?userId=' + enc(uid) + '&novelId=' + novel.id, { method: 'POST', headers: { Authorization: 'Bearer ' + s.token }, body: blob });
    let data = {}; try { data = await res.json(); } catch {}
    if (!res.ok || data.success === false) return fail({ status: res.status, data }, 'อัปโหลดปกไม่สำเร็จ');
    novel.cover_url = data.cover_url; paintCover(); toast('อัปโหลดปกแล้ว', 'ok');
  });
  $('cover-del').onclick = async () => {
    if (!novel) return;
    const r = await api('/api/novel/update', { method: 'POST', body: { userId: uid, id: novel.id, removeCover: true } });
    if (!r.ok) return fail(r, 'ลบปกไม่สำเร็จ');
    novel.cover_url = null; paintCover(); toast('ลบปกแล้ว', 'ok');
  };

  // ---------- ตอน ----------
  async function loadChapters() {
    const r = await api('/api/novel/get?slug=' + enc(novel.slug) + '&userId=' + enc(uid));
    if (!r.ok) return fail(r, 'โหลดสารบัญไม่สำเร็จ');
    const ul = $('ch-list'); ul.replaceChildren();
    if (!r.data.chapters.length) ul.append(el('li', 'px-4 py-3 text-sm text-slate-500', 'ยังไม่มีตอน'));
    r.data.chapters.forEach((c) => {
      const li = el('li', 'px-4 py-3 flex items-center gap-3 cursor-pointer hover:bg-amber-500/10 text-sm');
      li.append(el('span', 'text-slate-400 w-16 shrink-0', 'ตอน ' + c.no), el('span', 'flex-1 truncate', c.title),
        el('span', 'text-xs ' + (c.visibility === 'public' ? 'text-emerald-500' : 'text-slate-400'), c.visibility === 'public' ? 'เผยแพร่' : 'ร่าง'),
        el('span', 'text-xs text-amber-500 w-16 text-right', c.price > 0 ? c.price + ' coin' : 'ฟรี'));
      li.addEventListener('click', () => editChapter(c.no)); ul.append(li);
    });
  }
  function fillChapter(c) {
    chapter = c;
    $('ch-h').textContent = c ? 'แก้ไขตอนที่ ' + c.no : 'ตอนใหม่';
    $('c-no').value = c ? c.no : ''; $('c-no').disabled = !!c;
    $('c-price').value = c ? c.price : 0; $('c-vis').value = c ? c.visibility : 'draft';
    $('c-title').value = c ? c.title : ''; $('c-body').value = c ? c.content : '';
    $('c-del').classList.toggle('hidden', !c); count();
  }
  const count = () => { $('c-count').textContent = $('c-body').value.length.toLocaleString('th-TH') + ' / 150,000'; };
  $('c-body').addEventListener('input', count);
  $('new-ch').onclick = () => { fillChapter(null); $('ch-form').scrollIntoView({ behavior: 'smooth' }); };
  async function editChapter(no) {
    const r = await api('/api/novel/chapter-get?userId=' + enc(uid) + '&novelId=' + novel.id + '&no=' + no);
    if (!r.ok) return fail(r, 'โหลดตอนไม่สำเร็จ');
    fillChapter(r.data.chapter); $('ch-form').scrollIntoView({ behavior: 'smooth' });
  }
  $('ch-form').addEventListener('submit', async (e) => {
    e.preventDefault(); if (!novel) return;
    const r = await api('/api/novel/chapter-save', { method: 'POST', body: {
      userId: uid, novelId: novel.id, chapterId: chapter ? chapter.id : undefined, chapterNo: $('c-no').value ? Number($('c-no').value) : undefined,
      title: $('c-title').value, content: $('c-body').value, price: Number($('c-price').value) || 0, visibility: $('c-vis').value } });
    if (!r.ok) return fail(r, 'บันทึกตอนไม่สำเร็จ');
    toast('บันทึกตอนที่ ' + r.data.no + ' แล้ว', 'ok'); fillChapter(null); loadChapters();
  });
  $('c-del').onclick = async () => {
    if (!chapter || !confirm('ลบตอนที่ ' + chapter.no + ' ถาวร?')) return;
    const r = await api('/api/novel/chapter-delete', { method: 'POST', body: { userId: uid, novelId: novel.id, chapterId: chapter.id } });
    if (!r.ok) return fail(r, 'ลบตอนไม่สำเร็จ');
    toast('ลบตอนแล้ว', 'ok'); fillChapter(null); loadChapters();
  };

  fillChapter(null); loadList();
})();
</script>
</body>
</html>
