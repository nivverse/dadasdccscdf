<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>รายงาน | nivread แอดมิน</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/nivreadfavon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/nivreadfavon.png">
<meta name="theme-color" content="#0d0d0d">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif}.tab-on{color:#f59e0b!important;border-color:#f59e0b!important}</style>
</head>
<body class="bg-[#f3f4f6] text-slate-900 dark:bg-[#0d0d0d] dark:text-white min-h-screen flex flex-col relative overflow-x-hidden">

<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
  <div class="absolute top-1/2 -right-40 w-96 h-96 bg-orange-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
</div>

<header id="main-header" class="z-20"></header>

<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-6 z-10">
  <h1 class="text-3xl font-extrabold tracking-tight">รายงาน</h1>
  <p class="text-sm text-slate-600 dark:text-neutral-400 mt-1">เรื่องที่สมาชิกรายงานเข้ามา — โพสต์ ความคิดเห็น และผู้ใช้</p>

  <nav class="mt-5 flex border-b border-slate-200 dark:border-white/10" aria-label="สถานะรายงาน">
    <button type="button" data-tab="open" class="tab px-4 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-neutral-400 cursor-pointer">รอตรวจสอบ <span id="open-n" class="ml-1 px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-600 dark:text-amber-400 text-xs hidden"></span></button>
    <button type="button" data-tab="done" class="tab px-4 py-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 dark:text-neutral-400 cursor-pointer">ตรวจแล้ว</button>
  </nav>

  <div id="message" class="mt-4 text-sm font-medium min-h-[1.25rem]" role="status"></div>
  <div id="list" class="mt-2 space-y-4"></div>
</main>

<div id="main-footer" class="z-10"></div>
<script src="/nivread.js"></script>
<script>
  const { session, api, el, userUrl, ago, REASONS } = NIV;
  const s = session();
  if (!s.token || !s.userId) location.replace('/login?redirect=/admin');

  const $ = (id) => document.getElementById(id);
  const TYPE = { post: ['โพสต์', 'bg-sky-500/15 text-sky-600 dark:text-sky-400 border-sky-500/30'],
                 comment: ['ความคิดเห็น', 'bg-violet-500/15 text-violet-600 dark:text-violet-400 border-violet-500/30'],
                 user: ['ผู้ใช้', 'bg-rose-500/15 text-rose-600 dark:text-rose-400 border-rose-500/30'] };
  let tab = location.hash === '#done' ? 'done' : 'open';

  const say = (t, kind) => {
    const m = $('message');
    m.textContent = t || '';
    m.className = 'mt-4 text-sm font-medium min-h-[1.25rem] ' +
      (kind === 'err' ? 'text-rose-600 dark:text-rose-400' : kind === 'ok' ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500 dark:text-neutral-400');
  };

  async function resolve(g, action, card) {
    const btns = card.querySelectorAll('button');
    btns.forEach((b) => (b.disabled = true));
    const r = await api('/api/blog/report-resolve', { method: 'POST', body: { userId: s.userId, type: g.type, target: g.target, action } });
    if (!r.ok) {
      btns.forEach((b) => (b.disabled = false));
      return say(r.data.error || 'ทำรายการไม่สำเร็จ', 'err');
    }
    card.remove();
    say(action === 'delete' ? 'ลบเนื้อหาและปิดเรื่องแล้ว' : 'ปิดเรื่องแล้ว', 'ok');
    if (!$('list').children.length) $('list').append(el('p', 'text-sm text-slate-500 dark:text-neutral-400', 'ไม่มีรายงานที่รอตรวจสอบ'));
    refreshCount();
  }

  function card(g) {
    const c = el('article', 'rounded-2xl bg-white/85 dark:bg-white/5 border border-slate-200 dark:border-white/10 backdrop-blur-md shadow-sm p-4');
    const [tl, tc] = TYPE[g.type];
    const top = el('div', 'flex items-center gap-2 flex-wrap');
    top.append(el('span', 'px-2 py-0.5 rounded-full border text-xs ' + tc, tl));
    top.append(el('span', 'text-xs font-semibold text-amber-600 dark:text-amber-400', g.count + ' รายงาน'));
    top.append(el('span', 'text-xs text-slate-500 dark:text-neutral-400', ago(g.last_at)));
    if (g.preview && g.preview.hidden) top.append(el('span', 'px-2 py-0.5 rounded-full text-xs bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400', 'ซ่อนอยู่'));
    c.append(top);

    // เนื้อหาที่ถูกรายงาน (ใช้ textContent เสมอ กัน XSS)
    const pv = g.preview;
    const box = el('div', 'mt-3 rounded-xl bg-slate-100 dark:bg-black/40 p-3 text-sm break-words');
    if (!pv) {
      box.append(el('span', 'text-slate-500 dark:text-neutral-400', 'เนื้อหานี้ถูกลบไปแล้ว'));
    } else if (g.type === 'post') {
      const a = el('a', 'font-semibold hover:text-amber-500', pv.title); a.href = '/posts/' + pv.slug; a.target = '_blank'; a.rel = 'noopener';
      box.append(a);
    } else if (g.type === 'comment') {
      box.append(el('p', 'whitespace-pre-wrap leading-6', pv.content));
      const a = el('a', 'mt-2 inline-block text-xs text-amber-600 dark:text-amber-400 hover:opacity-70', 'ในโพสต์: ' + pv.title); a.href = '/posts/' + pv.slug + '#comments'; a.target = '_blank'; a.rel = 'noopener';
      box.append(a);
    } else {
      const a = el('a', 'font-semibold hover:text-amber-500', '@' + g.target); a.href = userUrl(g.target); a.target = '_blank'; a.rel = 'noopener';
      box.append(a);
    }
    if (pv && pv.owner_name && g.type !== 'user') box.append(el('div', 'mt-2 text-xs text-slate-500 dark:text-neutral-400', 'เจ้าของ: ' + pv.owner_name + ' (@' + pv.owner_id + ')'));
    c.append(box);

    // เหตุผลที่ถูกรายงาน
    const rs = el('div', 'mt-3 flex flex-wrap gap-1.5');
    for (const [k, n] of Object.entries(g.reasons)) rs.append(el('span', 'px-2 py-0.5 rounded-full text-xs bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400', (REASONS[k] || k) + ' × ' + n));
    c.append(rs);

    const det = g.reports.filter((x) => x.detail);
    if (det.length) {
      const ul = el('ul', 'mt-3 space-y-1.5 text-xs text-slate-600 dark:text-neutral-300');
      for (const x of det) ul.append(el('li', '', '“' + x.detail + '” — ' + x.reporter_name));
      c.append(ul);
    }

    if (tab === 'open') {
      const act = el('div', 'mt-4 flex flex-wrap gap-2');
      if (g.type !== 'user' && pv) {
        const del = el('button', 'px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold disabled:opacity-60 cursor-pointer', 'ลบเนื้อหา');
        del.type = 'button';
        del.addEventListener('click', () => { if (confirm('ลบ' + tl + 'นี้ถาวรใช่ไหม?')) resolve(g, 'delete', c); });
        act.append(del);
      }
      const ownerId = g.type === 'user' ? g.target : (pv && pv.owner_id);
      if (ownerId) {
        const banned = !!(pv && pv.owner_banned);
        const bb = el('button', 'px-4 py-2 rounded-xl border border-rose-500/50 text-rose-600 dark:text-rose-400 text-sm font-semibold hover:bg-rose-500/10 disabled:opacity-60 cursor-pointer', banned ? 'ปลดแบนผู้ใช้' : 'แบนผู้ใช้');
        bb.type = 'button';
        bb.addEventListener('click', async () => {
          if (!banned) { var reason = prompt('เหตุผลที่แบน @' + ownerId + ' (ไม่บังคับ) — โพสต์ทั้งหมดของผู้ใช้จะถูกซ่อน และโพสต์/คอมเมนต์/อัปโหลดไม่ได้', ''); if (reason === null) return; }
          else if (!confirm('ปลดแบน @' + ownerId + ' และคืนโพสต์ที่ถูกซ่อนจากการแบน?')) return;
          bb.disabled = true;
          const r = await api('/api/blog/ban', { method: 'POST', body: { userId: s.userId, target: ownerId, action: banned ? 'unban' : 'ban', reason: reason || '' } });
          bb.disabled = false;
          if (!r.ok) return say(r.data.error || 'ทำรายการไม่สำเร็จ', 'err');
          say(banned ? 'ปลดแบนแล้ว' : 'แบนแล้ว (ซ่อนโพสต์ ' + (r.data.posts || 0) + ' รายการ)', 'ok');
          if (pv) pv.owner_banned = !banned;
          bb.textContent = banned ? 'แบนผู้ใช้' : 'ปลดแบนผู้ใช้';
          load && load();
        });
        act.append(bb);
      }
      const ok = el('button', 'px-4 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/10 disabled:opacity-60 cursor-pointer', g.type === 'user' || !pv ? 'ปิดเรื่อง' : 'ไม่พบความผิด');
      ok.type = 'button';
      ok.addEventListener('click', () => resolve(g, 'dismiss', c));
      act.append(ok);
      c.append(act);
    } else {
      c.append(el('p', 'mt-3 text-xs text-slate-500 dark:text-neutral-400', 'ผลการตรวจ: ' + (g.action === 'delete' ? 'ลบเนื้อหา' : 'ไม่พบความผิด / ปิดเรื่อง')));
    }
    return c;
  }

  async function refreshCount() {
    const r = await api('/api/blog/reports?userId=' + encodeURIComponent(s.userId) + '&status=open');
    const n = r.ok ? r.data.groups.length : 0;
    $('open-n').textContent = n;
    $('open-n').classList.toggle('hidden', !n);
  }

  async function load() {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('tab-on', t.dataset.tab === tab));
    say('กำลังโหลด...');
    $('list').replaceChildren();
    const r = await api('/api/blog/reports?userId=' + encodeURIComponent(s.userId) + '&status=' + tab);
    if (r.status === 401) { NIV.logout(); return; }
    if (r.status === 403) {
      const me = await api('/api/blog/me?userId=' + encodeURIComponent(s.userId));
      const who = me.ok ? `${me.data.user.email || '(ไม่มีอีเมล)'} (@${me.data.user.id})` : '@' + s.userId;
      return say('บัญชีนี้ไม่ใช่แอดมิน — ตอนนี้ล็อกอินเป็น ' + who + ' ให้ล็อกอินด้วยบัญชี fnnzart@gmail.com', 'err');
    }
    if (r.status === 404) return say('Worker ยังไม่ได้อัปเดต (ไม่พบระบบรายงาน) กรุณา deploy blog-api.js ใหม่', 'err');
    if (!r.ok) return say(r.data.error || 'โหลดรายการไม่สำเร็จ', 'err');
    say('');
    const groups = r.data.groups;
    if (tab === 'open') { $('open-n').textContent = groups.length; $('open-n').classList.toggle('hidden', !groups.length); }
    if (!groups.length) { $('list').append(el('p', 'text-sm text-slate-500 dark:text-neutral-400', tab === 'open' ? 'ไม่มีรายงานที่รอตรวจสอบ' : 'ยังไม่มีรายงานที่ตรวจแล้ว')); return; }
    for (const g of groups) $('list').append(card(g));
  }

  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
    tab = t.dataset.tab;
    history.replaceState(null, '', '#' + tab);
    load();
  }));
  load();
  if (tab !== 'open') refreshCount();
</script>
</body>
</html>
