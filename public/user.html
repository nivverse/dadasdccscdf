<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>โปรไฟล์ผู้ใช้ | nivread</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/img/nivreadfavon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/nivreadfavon.png">
<meta name="theme-color" content="#0d0d0d">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif}.line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}</style>
<style>.tab-on{background:linear-gradient(to right,#f59e0b,#f97316);color:#fff;box-shadow:0 6px 16px -6px rgba(245,158,11,.55)}.tab:not(.tab-on){color:#64748b}</style>
</head>
<body class="bg-[#f3f4f6] text-slate-900 dark:bg-[#0d0d0d] dark:text-white min-h-screen flex flex-col relative overflow-x-hidden">
<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
  <div class="absolute top-1/2 -right-40 w-96 h-96 bg-orange-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
</div>
<header id="main-header" class="z-20"></header>
<main class="flex-1 z-10 w-full max-w-2xl mx-auto px-4 sm:px-6 py-6">
  <section id="card" class="rounded-3xl overflow-hidden bg-white/85 dark:bg-white/5 border border-slate-200 dark:border-white/10 backdrop-blur-md shadow-sm">
    <div class="h-28 sm:h-36 bg-gradient-to-br from-amber-500/60 via-orange-500/50 to-red-500/40"></div>
    <div class="px-5 pb-5">
      <div class="flex items-end justify-between gap-3">
        <div id="av" class="flex-shrink-0 -mt-12 rounded-full ring-4 ring-white dark:ring-[#121212] w-24 h-24 bg-slate-200 dark:bg-white/10"></div>
        <div class="flex flex-wrap items-center justify-end gap-2 min-w-0">
          <a id="edit" href="/profile" class="hidden whitespace-nowrap px-4 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/10">แก้ไขโปรไฟล์</a>
          <button id="report" type="button" title="รายงานผู้ใช้" aria-label="รายงานผู้ใช้" class="hidden flex-shrink-0 w-10 h-10 place-items-center rounded-xl border border-slate-300 dark:border-white/15 text-slate-500 dark:text-neutral-400 hover:text-amber-500 hover:border-amber-500/60 cursor-pointer"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></svg></button>
        </div>
      </div>
      <h1 id="name" class="mt-3 text-xl font-bold truncate">...</h1>
      <p id="uid" class="text-sm text-slate-500 dark:text-neutral-400 truncate"></p>
      <div class="mt-4 flex flex-wrap items-center gap-x-6 gap-y-2 text-slate-700 dark:text-neutral-200">
        <div class="flex items-center gap-1.5 " title="โพสต์" aria-label="โพสต์"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span id="n-posts" class="text-base font-extrabold tabular-nums">-</span></div>
        <div class="flex items-center gap-1.5 " title="ไลก์ที่ได้รับ" aria-label="ไลก์ที่ได้รับ"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 00-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 000-7.8z"/></svg><span id="n-likes" class="text-base font-extrabold tabular-nums">-</span></div>
        <button type="button" id="b-followers" class="flex items-center gap-1.5 cursor-pointer hover:opacity-70" title="ผู้ติดตาม" aria-label="ผู้ติดตาม"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/></svg><span id="n-followers" class="text-base font-extrabold tabular-nums">-</span></button>
        <button type="button" id="b-following" class="flex items-center gap-1.5 cursor-pointer hover:opacity-70" title="กำลังติดตาม" aria-label="กำลังติดตาม"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg><span id="n-following" class="text-base font-extrabold tabular-nums">-</span></button>
      </div>
    </div>
  </section>
  <nav id="tabs" class="mt-4 hidden flex rounded-2xl bg-white/85 dark:bg-white/5 border border-slate-200 dark:border-white/10 backdrop-blur-md p-1" aria-label="หมวดในโปรไฟล์">
    <button type="button" data-tab="posts" class="tab flex-1 py-2.5 rounded-xl text-sm font-semibold transition-colors cursor-pointer">โพสต์</button>
    <button type="button" data-tab="likes" class="tab flex-1 py-2.5 rounded-xl text-sm font-semibold transition-colors cursor-pointer">ถูกใจ</button>
  </nav>
  <div id="status" class="mt-6 text-sm text-slate-500 dark:text-neutral-400" role="status"></div>
  <section class="mt-4"><div id="posts" class="space-y-6"></div><div id="liked" class="hidden space-y-6"></div></section>
</main>
<div id="main-footer" class="z-10"></div>
<script src="/nivread.js"></script>
<script>
(async () => {
  const { api, el, session, avatarEl, postCardEl } = NIV;
  const $ = (id) => document.getElementById(id);
  const id = (new URLSearchParams(location.search).get('id') || '').trim();
  const fail = (t) => { $('card').classList.add('hidden'); $('status').textContent = t; };
  if (!id) return fail('ไม่พบผู้ใช้');
  const r = await api('/api/blog/user?id=' + encodeURIComponent(id));
  if (!r.ok) return fail(r.status === 404 ? 'ไม่พบผู้ใช้นี้' : (r.data.error || 'โหลดข้อมูลไม่สำเร็จ'));
  const { user, stats, posts } = r.data;
  const me = session();
  const own = !!me.token && me.userId === user.id;

  document.title = `${user.display_name} (@${user.id}) | nivread`;
  $('av').replaceChildren(avatarEl(user, 'w-24 h-24'));
  $('name').textContent = user.display_name;
  $('uid').textContent = '@' + user.id;
  $('n-posts').textContent = (stats.posts || 0).toLocaleString('th-TH');
  $('n-likes').textContent = (stats.likes || 0).toLocaleString('th-TH');
  if (own) $('edit').classList.remove('hidden');
  else {
    $('report').classList.remove('hidden'); $('report').classList.add('grid'); $('report').addEventListener('click', () => NIV.reportDialog('user', user.id));
    const fb = NIV.fbBtn('user', user.id, 'pill');
    $('report').before(fb); NIV.paintFollows();
  }

  // ---- ผู้ติดตาม / กำลังติดตาม ----
  $('n-followers').textContent = (stats.followers || 0).toLocaleString('th-TH');
  $('n-followers').dataset.followerCount = 'user:' + user.id;
  $('n-following').textContent = (stats.following || 0).toLocaleString('th-TH');
  async function showFollows(kind) {
    const wrap = el('div', 'fixed inset-0 z-50 grid place-items-center p-4 bg-black/60');
    const box = el('div', 'w-full max-w-sm max-h-[80vh] overflow-y-auto rounded-2xl bg-white dark:bg-[#161616] border border-slate-200 dark:border-white/10 shadow-xl p-4');
    const head = el('div', 'flex items-center justify-between mb-3');
    head.append(el('h2', 'font-bold', kind === 'followers' ? 'ผู้ติดตาม' : 'กำลังติดตาม'));
    const x = el('button', 'w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer', '✕'); x.type = 'button'; x.setAttribute('aria-label', 'ปิด');
    head.append(x);
    const list = el('div', 'space-y-3', 'กำลังโหลด...');
    box.append(head, list); wrap.append(box); document.body.append(wrap);
    const close = () => wrap.remove();
    x.addEventListener('click', close);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
    const d = await api(`/api/blog/follows?id=${encodeURIComponent(user.id)}&kind=${kind}`);
    list.replaceChildren();
    if (!d.ok) { list.textContent = d.data.error || 'โหลดไม่สำเร็จ'; return; }
    const cats = d.data.categories || [];
    if (cats.length) {
      const row = el('div', 'flex flex-wrap gap-2 pb-3 border-b border-slate-200 dark:border-white/10');
      for (const c of cats) { const a = el('a', 'px-3 py-1 rounded-full text-sm bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400', c); a.href = '/category/' + encodeURIComponent(c); row.append(a); }
      list.append(row);
    }
    if (!d.data.users.length && !cats.length) list.textContent = kind === 'followers' ? 'ยังไม่มีผู้ติดตาม' : 'ยังไม่ได้ติดตามใคร';
    for (const u of d.data.users) {
      const row = el('div', 'flex items-center gap-3');
      const a = el('a', 'flex items-center gap-3 min-w-0 flex-1'); a.href = NIV.userUrl(u.id);
      a.append(avatarEl(u, 'w-10 h-10'), el('span', 'font-semibold text-sm truncate', u.display_name));
      row.append(a, NIV.fbBtn('user', u.id, 'link')); list.append(row);
    }
    NIV.paintFollows(list);
  }
  $('b-followers').addEventListener('click', () => showFollows('followers'));
  $('b-following').addEventListener('click', () => showFollows('following'));

  // ---- ไอคอนถังขยะ (ลบโพสต์ของตัวเอง) ----
  const trash = (card, slug) => {
    const b = el('button', 'flex-shrink-0 w-9 h-9 grid place-items-center rounded-full text-slate-500 dark:text-neutral-400 hover:text-rose-500 hover:bg-rose-500/10 transition-colors cursor-pointer');
    b.type = 'button'; b.title = 'ลบโพสต์'; b.setAttribute('aria-label', 'ลบโพสต์');
    b.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>';
    b.addEventListener('click', async () => {
      if (!confirm('ลบโพสต์นี้ถาวรใช่ไหม?')) return;
      const d = await api('/api/blog/delete', { method: 'POST', body: { userId: me.userId, slug } });
      if (!d.ok) return alert(d.data.error || 'ลบไม่สำเร็จ');
      card.remove();
      if (!$('posts').children.length) $('status').textContent = 'ยังไม่มีโพสต์';
    });
    card.firstElementChild.append(b);
  };

  // ---- แท็บโพสต์ ----
  let editsLeft = {};
  if (own) {
    const m = await api('/api/blog/mine?userId=' + encodeURIComponent(user.id));
    if (m.ok) for (const x of m.data.posts) editsLeft[x.slug] = x.edits_left;
  }
  if (!posts.length) $('status').textContent = 'ยังไม่มีโพสต์';
  for (const p of posts) {
    const c = postCardEl(p);
    if (own) {
      const pen = c.querySelector('a[aria-label="แก้ไขโพสต์"]');
      const left = editsLeft[p.slug];
      if (pen && left === 0) { pen.removeAttribute('href'); pen.classList.add('opacity-40', 'pointer-events-none'); pen.title = 'แก้ไขครบ 2 ครั้งแล้ว'; }
      else if (pen && typeof left === 'number') pen.title = `แก้ไขโพสต์ (เหลือ ${left} ครั้ง)`;
      trash(c, p.slug);
    }
    $('posts').append(c);
  }

  // ---- แท็บถูกใจ (เห็นเฉพาะเจ้าของบัญชี) ----
  let likedLoaded = false;
  async function loadLiked() {
    if (likedLoaded) return;
    likedLoaded = true;
    $('status').textContent = 'กำลังโหลด...';
    const l = await api('/api/blog/liked-posts?userId=' + encodeURIComponent(user.id));
    $('status').textContent = '';
    if (!l.ok) { likedLoaded = false; $('status').textContent = l.data.error || 'โหลดรายการไม่สำเร็จ'; return; }
    if (!l.data.posts.length) { $('status').textContent = 'ยังไม่ได้กดถูกใจโพสต์ไหนเลย'; return; }
    for (const p of l.data.posts) $('liked').append(postCardEl(p));
  }

  function show(tab) {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('tab-on', t.dataset.tab === tab));
    $('posts').classList.toggle('hidden', tab !== 'posts');
    $('liked').classList.toggle('hidden', tab !== 'likes');
    $('status').textContent = '';
    if (tab === 'posts' && !posts.length) $('status').textContent = 'ยังไม่มีโพสต์';
    if (tab === 'likes') { if (likedLoaded && !$('liked').children.length) $('status').textContent = 'ยังไม่ได้กดถูกใจโพสต์ไหนเลย'; loadLiked(); }
    history.replaceState(null, '', location.pathname + location.search + '#' + tab);
  }
  if (own) {
    $('tabs').classList.remove('hidden');
    document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => show(t.dataset.tab)));
    show(location.hash === '#likes' ? 'likes' : 'posts');
  }
})();
</script>
</body>
</html>
