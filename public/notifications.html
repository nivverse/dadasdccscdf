<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>การแจ้งเตือน | nivread</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/img/icon-48.png" type="image/png" sizes="48x48">
<link rel="icon" href="/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d0d0d">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}details[open] .chev{transform:rotate(180deg)}</style>
</head>
<body class="bg-[#f3f4f6] text-slate-900 dark:bg-[#0d0d0d] dark:text-white min-h-screen flex flex-col relative overflow-x-hidden">
<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
  <div class="absolute top-1/2 -right-40 w-96 h-96 bg-orange-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
</div>
<header id="main-header" class="z-20"></header>
<main class="flex-1 z-10 w-full max-w-2xl mx-auto px-4 sm:px-6 py-6">
  <div class="flex items-center justify-between gap-3">
    <h1 class="text-3xl font-extrabold tracking-tight">การแจ้งเตือน</h1>
    <button id="refresh" type="button" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer disabled:opacity-50 disabled:cursor-default">รีเฟรช</button>
  </div>
  <p id="status" class="mt-2 text-xs text-slate-500 dark:text-neutral-400 min-h-[1rem]" role="status" aria-live="polite"></p>

  <div id="list" class="mt-4 space-y-2" aria-label="รายการแจ้งเตือน"></div>
  <button id="more" type="button" hidden class="mt-4 w-full py-3 rounded-xl border border-slate-300 dark:border-white/15 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer disabled:opacity-50">โหลดเพิ่ม</button>

  <details id="settings" class="mt-8 rounded-2xl border border-slate-200 dark:border-white/10 bg-white/70 dark:bg-white/[0.03]">
    <summary class="flex items-center justify-between gap-3 p-4 cursor-pointer select-none">
      <span class="font-semibold">ตั้งค่าการแจ้งเตือน</span>
      <svg class="chev w-5 h-5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <div class="px-4 pb-4 border-t border-slate-200 dark:border-white/10">
      <section id="push-sec" class="pt-4" hidden>
        <h2 class="text-sm font-bold">แจ้งเตือนบนอุปกรณ์นี้</h2>
        <p class="mt-1 text-xs text-slate-500 dark:text-neutral-400">รับแจ้งเตือนทันทีแม้ปิดเว็บอยู่ (ไม่กินคำขอเพิ่ม) · ตั้งค่าแยกตามอุปกรณ์</p>
        <p id="push-msg" class="mt-2 text-sm" role="status" aria-live="polite"></p>
        <div class="mt-3 flex flex-wrap gap-2">
          <button id="push-on" type="button" hidden class="px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-white text-sm font-semibold shadow-md shadow-amber-500/25 cursor-pointer disabled:opacity-60">เปิดแจ้งเตือนบนอุปกรณ์นี้</button>
          <button id="push-off" type="button" hidden class="px-4 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer disabled:opacity-60">ปิดบนอุปกรณ์นี้</button>
          <button id="push-test" type="button" hidden class="px-4 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-white/10 cursor-pointer disabled:opacity-60">ส่งข้อความทดสอบ</button>
        </div>
      </section>
      <section class="pt-5">
        <h2 class="text-sm font-bold">อยากรับแจ้งเรื่องอะไรบ้าง</h2>
        <div id="prefs" class="mt-1 divide-y divide-slate-200 dark:divide-white/10"></div>
        <p id="prefs-msg" class="mt-2 text-xs text-slate-500 dark:text-neutral-400 min-h-[1rem]" role="status" aria-live="polite"></p>
      </section>
    </div>
  </details>
</main>
<div id="main-footer" class="z-10"></div>
<script src="/nivread.js"></script>
<script>
(async () => {
  const { api, el, ago, avatarEl, session } = NIV;
  const $ = (id) => document.getElementById(id);
  const s = session();
  if (!s.token || !s.userId) { location.replace('/login?redirect=' + encodeURIComponent('/notifications')); return; }
  const uq = '?userId=' + encodeURIComponent(s.userId);

  // ---------- รายการแจ้งเตือน ----------
  const WHAT = {
    like: 'ถูกใจโพสต์ของคุณ', comment: 'แสดงความคิดเห็นในโพสต์ของคุณ', reply: 'ตอบกลับความคิดเห็นของคุณ', mention: 'กล่าวถึงคุณในความคิดเห็น',
    follow: 'เริ่มติดตามคุณ', repost: 'รีโพสต์โพสต์ของคุณ', comment_like: 'ถูกใจความคิดเห็นของคุณ', new_post: 'มีโพสต์ใหม่',
  };
  const ICON = { like: '❤️', comment: '💬', reply: '↩️', mention: '＠', follow: '👤', repost: '🔁', comment_like: '👍', new_post: '🆕', moderation: '🛡️' };
  const whoText = (it) => {
    const names = it.actors.map((a) => a.name);
    const rest = Math.max(0, it.n - names.length);
    return names.join(', ') + (rest > 0 ? ' และอีก ' + rest + ' คน' : '');
  };

  function itemEl(it) {
    const a = el('a', 'flex gap-3 p-3 rounded-2xl border transition hover:border-amber-500/60 ' +
      (it.unread ? 'border-amber-500/50 bg-amber-500/10' : 'border-slate-200 dark:border-white/10 bg-white/70 dark:bg-white/[0.03]'));
    a.href = it.url || '/notifications';

    const av = el('div', 'relative flex-shrink-0');
    if (it.type === 'moderation' || !it.actors.length) av.append(el('div', 'w-10 h-10 rounded-full grid place-items-center bg-slate-200 dark:bg-white/10 text-lg', ICON[it.type] || '🔔'));
    else {
      const u = it.actors[0];
      av.append(avatarEl({ id: u.id, display_name: u.name, avatar_url: u.avatar }, 'w-10 h-10'));
      av.append(el('span', 'absolute -bottom-1 -right-1 text-[11px] leading-none rounded-full p-0.5 bg-white dark:bg-[#1c1c1c]', ICON[it.type] || ''));
    }

    const tx = el('div', 'min-w-0 flex-1');
    const l1 = el('p', 'text-sm leading-snug break-words');
    if (it.type === 'moderation') {
      l1.append(el('b', 'font-semibold', 'แจ้งจากทีมงาน'));
      tx.append(l1, el('p', 'mt-0.5 text-sm text-slate-700 dark:text-neutral-300 break-words line-clamp-2', it.text || ''));
    } else {
      l1.append(el('b', 'font-semibold', whoText(it)), document.createTextNode(' ' + (WHAT[it.type] || '')));
      tx.append(l1);
      if (it.snippet) {
        tx.append(el('p', 'mt-0.5 text-sm text-slate-700 dark:text-neutral-300 break-words line-clamp-2', '“' + it.snippet + '”'));
        if (it.title) tx.append(el('p', 'mt-0.5 text-xs text-slate-500 dark:text-neutral-400 truncate', 'ในโพสต์: ' + it.title));
      } else if (it.title) {
        tx.append(el('p', 'mt-0.5 text-sm text-slate-600 dark:text-neutral-400 truncate', it.title));
      }
    }
    tx.append(el('p', 'mt-1 text-xs text-slate-500 dark:text-neutral-500', ago(it.at)));

    a.append(av, tx);
    if (it.unread) { const d = el('span', 'mt-1.5 w-2.5 h-2.5 rounded-full bg-amber-500 flex-shrink-0'); d.setAttribute('aria-label', 'ยังไม่ได้อ่าน'); a.append(d); }
    return a;
  }

  const list = $('list'), more = $('more'), refresh = $('refresh'), status = $('status');
  let nextBefore = 0, loading = false;
  const stamp = () => new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

  async function load(first) {
    if (loading) return;
    loading = true;
    refresh.disabled = true; more.disabled = true;
    if (first && !list.children.length) list.replaceChildren(NIV.skel ? NIV.skel(3) : el('div'));
    try {
      const r = await api('/api/blog/notifs' + uq + (first ? '&mark=1' : '&before=' + nextBefore));
      if (r.status === 401) { NIV.logout(); return; }
      if (!r.ok) { status.textContent = r.status === 429 ? 'กดถี่เกินไป กรุณารอสักครู่แล้วลองใหม่' : 'โหลดไม่สำเร็จ กดรีเฟรชเพื่อลองใหม่'; if (first) list.replaceChildren(); return; }
      const d = r.data;
      if (first) list.replaceChildren();
      d.items.forEach((it) => list.append(itemEl(it)));
      nextBefore = d.nextBefore || 0;
      more.hidden = !d.hasMore;
      if (first) {
        NIV.notif?.setCount(0);
        status.textContent = 'อัปเดตล่าสุด ' + stamp();
        if (!d.items.length) {
          const e = el('div', 'text-center py-14 text-slate-500 dark:text-neutral-400');
          e.append(el('div', 'text-4xl', '🔔'), el('p', 'mt-3 font-semibold', 'ยังไม่มีการแจ้งเตือน'), el('p', 'mt-1 text-sm', 'เมื่อมีคนถูกใจ คอมเมนต์ หรือติดตามคุณ จะแสดงที่นี่'));
          list.append(e);
        }
      }
    } catch { status.textContent = 'เชื่อมต่อไม่ได้ กรุณาลองใหม่'; if (first) list.replaceChildren(); }
    finally {
      loading = false; more.disabled = false;
      setTimeout(() => { refresh.disabled = false; }, first ? 3000 : 0); // กันกดรัว ๆ (ประหยัดคำขอ)
    }
  }
  refresh.addEventListener('click', () => load(true));
  more.addEventListener('click', () => load(false));
  load(true);

  // ---------- ตั้งค่า (โหลดตอนเปิดครั้งแรกเท่านั้น → ผู้ที่แค่ดูรายการไม่เสียคำขอเพิ่ม) ----------
  const PREF_ITEMS = [
    ['like', 'มีคนถูกใจโพสต์ของฉัน'], ['comment', 'มีคอมเมนต์ในโพสต์ของฉัน'], ['reply', 'มีคนตอบกลับคอมเมนต์ของฉัน'], ['mention', 'มีคนกล่าวถึงฉัน (@)'],
    ['follow', 'มีผู้ติดตามใหม่'], ['repost', 'มีคนรีโพสต์โพสต์ของฉัน'], ['comment_like', 'มีคนถูกใจคอมเมนต์ของฉัน'], ['new_post', 'โพสต์ใหม่จากคนและหมวดที่ฉันติดตาม'],
  ];
  let prefs = null, saveTimer = 0;
  const prefsMsg = $('prefs-msg');

  function switchEl(key, label, on) {
    const row = el('label', 'flex items-center justify-between gap-3 py-2.5 cursor-pointer');
    row.append(el('span', 'text-sm', label));
    const box = el('span', 'relative inline-block w-11 h-6 flex-shrink-0');
    const inp = el('input', 'peer sr-only'); inp.type = 'checkbox'; inp.checked = on;
    inp.addEventListener('change', () => {
      prefs[key] = inp.checked ? 1 : 0;
      prefsMsg.textContent = 'กำลังบันทึก…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        const r = await api('/api/blog/notif-prefs', { method: 'POST', body: { userId: s.userId, prefs } });
        prefsMsg.textContent = r.ok ? 'บันทึกแล้ว' : 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
      }, 600);
    });
    box.append(inp, el('span', 'absolute inset-0 rounded-full bg-slate-300 dark:bg-white/15 peer-checked:bg-amber-500 peer-focus-visible:ring-2 peer-focus-visible:ring-amber-500/60 transition-colors'),
      el('span', 'absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow transition-transform peer-checked:translate-x-5'));
    row.append(box);
    return row;
  }

  // ---------- Web Push ของอุปกรณ์นี้ ----------
  const pushSec = $('push-sec'), pushMsg = $('push-msg'), bOn = $('push-on'), bOff = $('push-off'), bTest = $('push-test');
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const b64uToU8 = (str) => { const b = atob((str + '='.repeat((4 - (str.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); };
  const sameKey = (buf, u8) => { if (!buf) return false; const a = new Uint8Array(buf); return a.length === u8.length && a.every((v, i) => v === u8[i]); };

  async function currentSub() {
    if (!supported) return null;
    const reg = await navigator.serviceWorker.getRegistration('/sw.js');
    return reg ? reg.pushManager.getSubscription() : null;
  }
  async function refreshPushUI() {
    bOn.hidden = bOff.hidden = bTest.hidden = true;
    if (!supported) {
      pushMsg.textContent = isIOS && !standalone
        ? 'บน iPhone/iPad: กดปุ่มแชร์ → “เพิ่มลงในหน้าจอโฮม” แล้วเปิดเว็บจากไอคอนนั้น จึงจะเปิดแจ้งเตือนได้ (ต้องใช้ iOS 16.4 ขึ้นไป)'
        : 'เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือนแบบ push (ยังดูรายการแจ้งเตือนในหน้านี้ได้ตามปกติ)';
      return;
    }
    if (Notification.permission === 'denied') { pushMsg.textContent = 'คุณบล็อกการแจ้งเตือนของเว็บนี้ไว้ในเบราว์เซอร์ หากต้องการเปิดให้ไปที่การตั้งค่าไซต์ (รูปแม่กุญแจข้างที่อยู่เว็บ) แล้วอนุญาตการแจ้งเตือน'; return; }
    const sub = await currentSub();
    if (sub && Notification.permission === 'granted') { pushMsg.textContent = '✓ เปิดแจ้งเตือนบนอุปกรณ์นี้อยู่'; bOff.hidden = bTest.hidden = false; }
    else { pushMsg.textContent = isIOS && !standalone ? 'แนะนำให้เปิดเว็บจากไอคอนบนหน้าจอโฮมก่อน แล้วค่อยกดเปิดแจ้งเตือน' : 'ยังไม่ได้เปิดบนอุปกรณ์นี้'; bOn.hidden = false; }
  }
  bOn.addEventListener('click', async () => {
    bOn.disabled = true; pushMsg.textContent = 'กำลังเปิด…';
    try {
      const kr = await api('/api/blog/push-key');
      if (!kr.ok) throw new Error(kr.data.error || 'เซิร์ฟเวอร์ยังไม่พร้อมใช้งาน');
      const key = b64uToU8(kr.data.key);
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { pushMsg.textContent = perm === 'denied' ? 'คุณไม่อนุญาตการแจ้งเตือน' : 'ยังไม่ได้อนุญาตการแจ้งเตือน'; return; }
      let sub = await reg.pushManager.getSubscription();
      if (sub && !sameKey(sub.options && sub.options.applicationServerKey, key)) { await sub.unsubscribe().catch(() => {}); sub = null; } // กุญแจฝั่งเซิร์ฟเวอร์เปลี่ยน
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      const r = await api('/api/blog/push-subscribe', { method: 'POST', body: { userId: s.userId, subscription: sub.toJSON() } });
      if (!r.ok) { await sub.unsubscribe().catch(() => {}); throw new Error(r.data.error || 'ลงทะเบียนอุปกรณ์ไม่สำเร็จ'); }
      try { localStorage.setItem('nv_push_ep', sub.endpoint); localStorage.setItem('nv_push_t', String(Date.now())); } catch {}
    } catch (e) { pushMsg.textContent = 'เปิดไม่สำเร็จ: ' + (e && e.message ? e.message : 'ลองใหม่อีกครั้ง'); return; }
    finally { bOn.disabled = false; }
    await refreshPushUI();
  });
  bOff.addEventListener('click', async () => {
    bOff.disabled = true;
    try {
      const sub = await currentSub();
      if (sub) { await api('/api/blog/push-unsubscribe', { method: 'POST', body: { userId: s.userId, endpoint: sub.endpoint } }); await sub.unsubscribe().catch(() => {}); }
      try { localStorage.removeItem('nv_push_ep'); localStorage.removeItem('nv_push_t'); } catch {}
    } finally { bOff.disabled = false; }
    await refreshPushUI();
  });
  bTest.addEventListener('click', async () => {
    bTest.disabled = true; pushMsg.textContent = 'กำลังส่งข้อความทดสอบ…';
    const r = await api('/api/blog/push-test', { method: 'POST', body: { userId: s.userId } });
    pushMsg.textContent = r.ok ? '✓ ส่งแล้ว ถ้าไม่เห็นการแจ้งเตือน ให้ตรวจการตั้งค่าแจ้งเตือนของเบราว์เซอร์/ระบบ' : (r.data.error || 'ส่งไม่สำเร็จ');
    setTimeout(() => { bTest.disabled = false; }, 4000);
  });

  let settingsLoaded = false;
  $('settings').addEventListener('toggle', async (e) => {
    if (!e.target.open || settingsLoaded) return;
    settingsLoaded = true;
    const r = await api('/api/blog/notif-prefs' + uq);
    if (!r.ok) { settingsLoaded = false; prefsMsg.textContent = 'โหลดการตั้งค่าไม่สำเร็จ ปิดแล้วเปิดใหม่อีกครั้ง'; return; }
    prefs = r.data.prefs;
    $('prefs').replaceChildren(...PREF_ITEMS.map(([k, label]) => switchEl(k, label, prefs[k] !== 0)));
    if (r.data.pushAvailable) { pushSec.hidden = false; refreshPushUI(); }
  });
})();
</script>
</body>
</html>
