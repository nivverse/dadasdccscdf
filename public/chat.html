<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>แชท | nivread</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/nivreadfavon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/nivreadfavon.png">
<meta name="theme-color" content="#0d0d0d">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--panel:rgba(255,255,255,.88);--line:rgba(226,232,240,.9);--text:#0f172a;--mute:#64748b;--in:#fff;--hov:#f1f5f9;--fld:#f1f5f9;--g:linear-gradient(135deg,#fbbf24,#f97316);--amber:#f59e0b}
html.dark{--bg:#0d0d0d;--panel:rgba(18,18,18,.82);--line:rgba(255,255,255,.1);--text:#fff;--mute:#a3a3a3;--in:rgba(255,255,255,.09);--hov:rgba(255,255,255,.05);--fld:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Kanit',system-ui,sans-serif;position:relative}
body::before,body::after{content:"";position:fixed;width:384px;height:384px;border-radius:50%;filter:blur(128px);background:rgba(245,158,11,.25);pointer-events:none}
body::before{top:-160px;left:-160px}body::after{top:50%;right:-160px;background:rgba(249,115,22,.22)}
#main-header{position:relative;z-index:20}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{flex:1;min-height:0;padding:16px;position:relative;z-index:1}
.app{display:grid;grid-template-columns:340px minmax(0,1fr);max-width:1080px;height:100%;margin:0 auto;background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.side,.chat,.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane[hidden],.empty[hidden]{display:none}
.chat{height:100%}.pane{flex:1}
.side{border-right:1px solid var(--line)}
.top{padding:16px 18px 8px}.top h1{font-size:20px;font-weight:600}
.srch{display:block;margin:4px 16px 10px}
.srch input{width:100%;height:40px;padding:0 14px;border-radius:14px;background:var(--fld);outline:0;cursor:text}
.list{flex:1;overflow-y:auto;padding:0 8px 8px}
.note{padding:24px 16px;text-align:center;color:var(--mute);font-size:14px;line-height:1.7}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;width:100%;padding:10px;border-radius:16px;text-align:left;align-items:center}
.row:hover{background:var(--hov)}.row.on{background:rgba(245,158,11,.16)}
.av{width:48px;height:48px;border-radius:50%;background:var(--a);display:grid;place-items:center;font-weight:600;color:#1c1917;flex:none;object-fit:cover}
.mid{min-width:0}
.rn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--mute)}
.bd{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--g);color:#2a1500;font-weight:500;display:grid;place-items:center}
.empty{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mute);line-height:1.7}
.hd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.hd .av{width:42px;height:42px}.hn{font-weight:600}.back{display:none;width:38px;height:38px;border-radius:50%;place-items:center;color:var(--mute)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:16px;background:radial-gradient(circle at 15% 0,rgba(245,158,11,.08),transparent 55%)}
.date{align-self:center;margin:6px 0;font-size:12px;padding:3px 12px;border-radius:99px;background:var(--in);color:var(--mute)}
.older{align-self:center;font-size:13px;color:var(--amber);padding:4px 12px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:min(80%,520px)}
.m.in{align-self:flex-start}.m.out{align-self:flex-end}
.m .av{width:34px;height:34px;font-size:14px}.av.ph{visibility:hidden}
.bw{display:flex;gap:6px;align-items:flex-end}.out .bw{flex-direction:row-reverse}
.b{padding:8px 13px;border-radius:18px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.in .b{background:var(--in);border-bottom-left-radius:5px;box-shadow:0 1px 0 var(--line)}
.out .b{background:var(--g);color:#2a1500;border-bottom-right-radius:5px}
.meta{font-size:11px;line-height:1.3;color:var(--mute);white-space:nowrap}.out .meta{text-align:right}
.err{padding:0 18px;font-size:13px;color:#ef4444}.err:not(:empty){padding-bottom:6px}
.comp{display:flex;align-items:center;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--line)}
.comp input{flex:1;min-width:0;height:44px;padding:0 16px;border-radius:22px;background:var(--fld);outline:0;cursor:text}
.go{width:44px;height:44px;border-radius:50%;background:var(--g);color:#2a1500;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(245,158,11,.6)}
.go:disabled{opacity:.5;cursor:not-allowed}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:760px){
.wrap{padding:0}.app{border-radius:0;border:0;grid-template-columns:1fr}
.chat{display:none}.app.open .chat{display:flex}.app.open .side{display:none}.back{display:grid}.m{max-width:88%}}
</style>
</head>
<body>
<header id="main-header" class="z-20"></header>
<main class="wrap">
  <div class="app" id="app">
    <aside class="side">
      <div class="top"><h1>แชท</h1></div>
      <label class="srch"><input id="q" placeholder="ค้นหาเพื่อน" autocomplete="off"></label>
      <div class="list" id="list"><p class="note">กำลังโหลด...</p></div>
    </aside>
    <section class="chat">
      <div class="empty" id="empty"><p id="empty-t">เลือกเพื่อนจากรายการเพื่อเริ่มแชท<br>แชทได้เฉพาะคนที่ติดตามกันและกัน</p></div>
      <div class="pane" id="pane" hidden>
        <header class="hd">
          <button class="back" id="bk" aria-label="กลับ"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span id="hav"></span><div class="hn" id="hn"></div>
        </header>
        <div class="msgs" id="msgs"></div>
        <div class="err" id="err" role="alert"></div>
        <form class="comp" id="comp">
          <input id="inp" placeholder="พิมพ์ข้อความ" maxlength="1000" autocomplete="off">
          <button class="go" id="go" type="submit" aria-label="ส่ง"><svg class="i" viewBox="0 0 24 24"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3z" fill="currentColor"/></svg></button>
        </form>
      </div>
    </section>
  </div>
</main>
<div id="main-footer" class="z-10" hidden></div>
<script src="/nivread.js"></script>
<script>
(() => {
  const s = NIV.session();
  if (!s.token || !s.userId) { location.replace('/login?redirect=/chat'); return; }
  const me = s.userId, $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const COLORS = [['#fbbf24', '#f97316'], ['#f9a8d4', '#f472b6'], ['#7dd3fc', '#38bdf8'], ['#c4b5fd', '#a78bfa'], ['#bef264', '#84cc16'], ['#5eead4', '#2dd4bf']];
  const avatar = (u, cls = '') => {
    if (u.avatar_url && /^https?:\/\//.test(u.avatar_url)) return `<img class="av ${cls}" src="${esc(u.avatar_url)}" alt="">`;
    const [c1, c2] = COLORS[[...u.id].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
    return `<div class="av ${cls}" style="--a:linear-gradient(135deg,${c1},${c2})">${esc([...(u.display_name || u.id)][0].toUpperCase())}</div>`;
  };
  const get = (path) => NIV.api(path + (path.includes('?') ? '&' : '?') + 'userId=' + encodeURIComponent(me));
  const post = (path, body) => NIV.api(path, { method: 'POST', body: { userId: me, ...body } });
  const tm = (t) => new Date(t).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false });
  const dk = (t) => new Date(t).toDateString();
  const dl = (t) => dk(t) === dk(Date.now()) ? 'วันนี้' : dk(t) === dk(Date.now() - 864e5) ? 'เมื่อวาน' : new Date(t).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
  const short = (t) => dk(t) === dk(Date.now()) ? tm(t) : dl(t);

  let friends = [], peer = null, msgs = [], peerRead = 0, more = false, delay = 3000, timer = null, sending = false;

  // ---------- รายชื่อเพื่อน ----------
  function renderList() {
    const q = $('q').value.trim().toLowerCase();
    const rows = friends.filter((f) => !q || f.display_name.toLowerCase().includes(q) || f.id.toLowerCase().includes(q));
    $('list').innerHTML = rows.length ? rows.map((f) =>
      `<button class="row${peer && peer.id === f.id ? ' on' : ''}" data-id="${esc(f.id)}">${avatar(f)}<span class="mid"><div class="rn">${esc(f.display_name)}</div><div class="rp">${f.last ? esc((f.last.mine ? 'คุณ: ' : '') + f.last.body) : 'เริ่มคุยกันเลย'}</div></span><span class="rr">${f.last ? short(f.last.at) : ''}${f.unread ? `<span class="bd">${f.unread > 99 ? '99+' : f.unread}</span>` : ''}</span></button>`
    ).join('') : `<p class="note">${friends.length ? 'ไม่พบชื่อที่ค้นหา' : 'ยังไม่มีเพื่อนแชท<br>ต้องติดตามกันและกัน จึงจะแชทกันได้'}</p>`;
  }
  async function loadFriends() {
    const r = await get('/api/chat/friends');
    if (r.status === 401) return NIV.logout();
    if (!r.ok) return;
    friends = r.data.friends;
    if (peer) { const f = friends.find((x) => x.id === peer.id); if (f) f.unread = 0; }
    renderList();
  }
  $('q').oninput = renderList;
  $('list').onclick = (e) => { const b = e.target.closest('.row'); if (b) openPeer(b.dataset.id); };

  // ---------- ข้อความ ----------
  function renderMsgs(stick) {
    const box = $('msgs'), nearEnd = stick || box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    let html = more ? '<button class="older" id="older">โหลดข้อความเก่า</button>' : '', day = '', prev = null;
    for (const m of msgs) {
      if (dk(m.created_at) !== day) { day = dk(m.created_at); html += `<div class="date">${dl(m.created_at)}</div>`; prev = null; }
      const mine = m.sender_id === me;
      html += `<div class="m ${mine ? 'out' : 'in'}">${mine ? '' : (!prev || prev.sender_id !== m.sender_id ? avatar(peer, 's') : '<span class="av ph"></span>')}<div class="bw"><div class="b">${esc(m.body)}</div><div class="meta">${mine && m.id <= peerRead ? 'อ่านแล้ว<br>' : ''}${tm(m.created_at)}</div></div></div>`;
      prev = m;
    }
    box.innerHTML = html;
    if (nearEnd) box.scrollTop = box.scrollHeight;
  }
  const query = (extra) => '/api/chat/messages?peer=' + encodeURIComponent(peer.id) + extra;
  function lost(r) { // ไม่ได้ติดตามกันแล้ว
    $('empty-t').textContent = r.data.error || 'แชทนี้ใช้ไม่ได้แล้ว';
    closePeer(); loadFriends();
  }
  async function openPeer(id) {
    const f = friends.find((x) => x.id === id);
    if (!f) { $('empty-t').innerHTML = `ต้องติดตามกันและกันกับ @${esc(id)} ก่อน จึงจะแชทกันได้`; return; }
    peer = f; msgs = []; peerRead = 0; more = false; delay = 3000; f.unread = 0;
    $('app').classList.add('open'); $('empty').hidden = true; $('pane').hidden = false; $('err').textContent = '';
    $('hav').innerHTML = avatar(f); $('hn').textContent = f.display_name;
    history.replaceState(null, '', '#' + encodeURIComponent(id));
    renderList(); $('msgs').innerHTML = '';
    const r = await get(query(''));
    if (!peer || peer.id !== id) return;
    if (r.status === 401) return NIV.logout();
    if (r.status === 403) return lost(r);
    if (!r.ok) { $('err').textContent = r.data.error || 'โหลดข้อความไม่สำเร็จ'; return; }
    msgs = r.data.messages; peerRead = r.data.peerRead; more = r.data.more;
    renderMsgs(true); schedule(); $('inp').focus();
  }
  function closePeer() {
    peer = null; clearTimeout(timer);
    $('app').classList.remove('open'); $('pane').hidden = true; $('empty').hidden = false;
    history.replaceState(null, '', location.pathname); renderList();
  }
  $('bk').onclick = closePeer;
  $('msgs').onclick = async (e) => {
    if (e.target.id !== 'older' || !msgs.length) return;
    const r = await get(query('&before=' + msgs[0].id));
    if (r.ok) { msgs = r.data.messages.concat(msgs); more = r.data.more; const b = $('msgs'), h = b.scrollHeight; renderMsgs(false); b.scrollTop = b.scrollHeight - h; }
  };

  // ---------- โพลลิ่ง: ถี่เมื่อมีความเคลื่อนไหว ห่างขึ้นเรื่อยๆ เมื่อเงียบ (ประหยัดโควตา request) ----------
  function schedule() { clearTimeout(timer); if (peer) timer = setTimeout(poll, document.hidden ? 30000 : delay); }
  async function poll() {
    if (!peer || document.hidden) return schedule();
    const id = peer.id, last = msgs.length ? msgs[msgs.length - 1].id : 0;
    const r = await get(query(last ? '&after=' + last : ''));
    if (!peer || peer.id !== id) return;
    if (r.status === 401) return NIV.logout();
    if (r.status === 403) return lost(r);
    if (r.ok) {
      const nw = r.data.messages.filter((m) => m.id > last), moved = r.data.peerRead > peerRead;
      peerRead = Math.max(peerRead, r.data.peerRead);
      if (nw.length) { msgs.push(...nw); delay = 3000; } else delay = Math.min(delay * 1.5, 20000);
      if (nw.length || moved) renderMsgs(false);
    }
    schedule();
  }

  // ---------- ส่ง ----------
  $('comp').onsubmit = async (e) => {
    e.preventDefault();
    const text = $('inp').value.trim();
    if (!text || !peer || sending) return;
    sending = true; $('go').disabled = true; $('err').textContent = '';
    const id = peer.id, r = await post('/api/chat/send', { peer: id, text });
    sending = false; $('go').disabled = false;
    if (r.status === 401) return NIV.logout();
    if (r.status === 403) return lost(r);
    if (!r.ok) { $('err').textContent = r.data.error || 'ส่งไม่สำเร็จ'; return; }
    $('inp').value = '';
    if (!peer || peer.id !== id) return;
    msgs.push(r.data.message); delay = 3000; renderMsgs(true); schedule();
    const f = friends.find((x) => x.id === id);
    if (f) { f.last = { body: text, mine: true, at: r.data.message.created_at }; friends.sort((x, y) => (y.last ? y.last.at : 0) - (x.last ? x.last.at : 0)); renderList(); }
  };

  document.addEventListener('visibilitychange', () => { if (!document.hidden) { delay = 3000; loadFriends(); if (peer) poll(); } });
  setInterval(() => { if (!document.hidden) loadFriends(); }, 25000);
  loadFriends().then(() => { const h = decodeURIComponent(location.hash.slice(1)); if (h) openPeer(h); });
})();
</script>
</body>
</html>
