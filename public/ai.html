<script>
  // ลบแถบเมนู/footer ล่างที่ /nivread.js ฉีดเข้ามา โดยจับจากลักษณะ (ลอยติดขอบล่างจอ) ไม่ผูกกับชื่อ
  (() => {
    const SKIP = (el) => el.tagName === 'MAIN' || el.tagName === 'SCRIPT' || el.tagName === 'STYLE' || el.tagName === 'LINK' || el.id === 'clr-modal';
    const atBottom = (el) => {
      const cs = getComputedStyle(el);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') return false;
      const r = el.getBoundingClientRect();
      return r.height > 0 && r.top > innerHeight * 0.55 && r.bottom >= innerHeight - 8;
    };
    const nameHit = (el) => el.tagName === 'FOOTER' || el.tagName === 'NAV' || /foot|bottom|tab-?bar|mobile-?nav/i.test(el.id + ' ' + el.className);
    const sweep = () => {
      [...document.body.children].forEach((el) => {
        if (SKIP(el) || el.id === 'main-header') return;
        if (nameHit(el) || atBottom(el)) { el.remove(); return; }
        el.querySelectorAll('*').forEach((d) => { if (atBottom(d)) d.remove(); });
      });
      document.body.style.paddingBottom = '0';
    };
    let q = 0; const later = () => { if (!q) q = requestAnimationFrame(() => { q = 0; sweep(); }); };
    new MutationObserver(later).observe(document.body, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', later); window.addEventListener('load', later); window.addEventListener('resize', later);
    setTimeout(sweep, 500); setTimeout(sweep, 1500);
  })();
</script>

<script>
(() => {
  const s = NIV.session();
  if (!s.token || !s.userId) { location.replace('/login?redirect=/ai'); return; }
  const API = 'https://api.fnnz.art/api/ai', Q = 'app=nivread';   // ถ้า NIV มีค่า base URL ของ API อยู่แล้ว ให้ใช้ค่านั้นแทน
  const H = { Authorization: 'Bearer ' + s.token };
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send'), stopBtn = $('stop'), form = $('form'), energyEl = $('energy');

  const MODES = {
    general: { name: 'คุยทั่วไป', max: 2000, ph: 'พิมพ์ข้อความ...', title: 'ถามอะไรก็ได้', hi: 'ช่วยคิด ช่วยเขียน ช่วยอธิบาย หรือแค่คุยเล่น เรื่องที่เปลี่ยนบ่อย เช่น ข่าวและราคา จะค้นข้อมูลล่าสุดให้ก่อนตอบ',
      chips: ['ช่วยวางแผนวันนี้ให้หน่อย', 'อธิบายดอกเบี้ยทบต้นให้เข้าใจง่าย', 'ช่วยตรวจและแก้ภาษาข้อความนี้', 'แนะนำวิธีจำคำศัพท์ภาษาอังกฤษ'] },
    docs: { name: 'จัดเอกสาร', max: 8000, ph: 'วางข้อความ แล้วบอกว่าจะให้จัดอย่างไร', title: 'วางข้อความ แล้วบอกว่าจะให้ทำอะไร', hi: 'สรุป ย่อความ จัดหัวข้อ ปรับสำนวนให้เป็นทางการ หรือร่างเอกสารจากข้อมูลคร่าว ๆ วางข้อความได้ครั้งละประมาณ 8,000 ตัวอักษร (ยังไม่รองรับไฟล์แนบ)',
      chips: ['ร่างอีเมลขอเลื่อนนัดประชุมให้สุภาพ', 'จัดโน้ตประชุมเป็นรายงานพร้อมสิ่งที่ต้องทำ', 'เขียนจดหมายลากิจแบบเป็นทางการ', 'สรุปข้อความที่จะวางให้เหลือ 5 ข้อ'] },
    fortune: { name: 'ดูดวง', max: 2000, ph: 'บอกวันเกิด หรือเรื่องที่อยากรู้...', title: 'ดูดวงเพื่อความบันเทิง', hi: 'ดวงตามวันเกิด ราศี ไพ่ทาโรต์ และเลขศาสตร์ ใช้เป็นแนวคิดประกอบการตัดสินใจ ไม่ใช่คำตัดสิน',
      chips: ['ดูดวงรายวันของวันนี้', 'ดวงการงานของคนเกิดวันจันทร์', 'เปิดไพ่ทาโรต์ 3 ใบเรื่องความรัก', 'ขอเลขมงคลประจำสัปดาห์นี้'] },
  };
  const tabs = [...document.querySelectorAll('[data-tab]')];
  let mode = 'general', ctrl = null, busy = false, loadId = 0, stick = true;

  // รูปแบบข้อความ: ผู้ใช้ = กล่องเทาอ่อนชิดขวา / AI = ข้อความเต็มคอลัมน์ ไม่มีกรอบ
  const BUB = {
    user: 'ml-auto max-w-[85%] w-fit rounded-3xl bg-slate-200/70 dark:bg-white/10 px-4 py-2.5 text-[16px] leading-relaxed whitespace-pre-wrap',
    assistant: 'md w-full text-[16px] sm:text-[17px] leading-[1.85]',
    err: 'w-full border-l-2 border-red-500/70 pl-3 text-[15px] leading-relaxed text-red-500',
  };
  const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  log.addEventListener('scroll', () => { stick = nearBottom(); });
  // เลื่อนตามเฉพาะตอนผู้ใช้อยู่ท้ายแชท ถ้าเลื่อนขึ้นไปอ่านจะไม่ดึงกลับ
  const scrollEnd = () => requestAnimationFrame(() => { if (stick) log.scrollTop = log.scrollHeight; });

  function setText(b, role, text, live) {
    // ระหว่างสตรีม ซ่อนบล็อกกราฟ/ตัวเลขที่ยังไม่เสร็จไว้ก่อน แล้วค่อยวาดตอนจบ
    if (live && role === 'assistant') text = text.replace(/```(chart|stats)[\s\S]*?(```|$)/g, '\n\n*กำลังเตรียมข้อมูลสรุป…*\n\n');
    if (role === 'assistant' && window.marked && window.DOMPurify) b.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
    else b.textContent = text;
  }

  // ---------- ลูกเล่นข้อมูล: กราฟ / ตัวเลขสรุป / ตารางโต้ตอบ ----------
  const PAL = ['#f59e0b', '#6366f1', '#10b981', '#ef4444', '#06b6d4', '#ec4899', '#84cc16', '#8b5cf6'];
  const isDark = () => document.documentElement.classList.contains('dark');
  const cols = () => (isDark() ? { text: '#a8a29e', grid: 'rgba(255,255,255,.07)' } : { text: '#64748b', grid: 'rgba(15,23,42,.08)' });
  const SV = (d) => '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  const ICON = {
    dl: SV('<path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 15v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1"/>'),
    ex: SV('<path d="M12 3h5v5M8 17H3v-5M17 3l-5.5 5.5M3 17l5.5-5.5"/>'),
  };
  const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const tool = (icon, label, title, fn) => {
    const b = h('button', 'dcard-btn'); b.type = 'button'; b.title = title; b.setAttribute('aria-label', title); b.innerHTML = icon;
    if (label) b.appendChild(h('span', null, label)); b.onclick = fn; return b;
  };
  const download = (href, name) => { const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); };
  let charts = [], vmChart = null;

  function cleanChart(o) {
    if (!o || typeof o !== 'object') return null;
    const type = ['bar', 'line', 'pie', 'doughnut'].includes(o.type) ? o.type : 'bar';
    const labels = (Array.isArray(o.labels) ? o.labels : []).slice(0, 60).map(String);
    const datasets = (Array.isArray(o.datasets) ? o.datasets : []).slice(0, 8).map((d) => ({
      label: String((d && d.label) || ''),
      data: (Array.isArray(d && d.data) ? d.data : []).slice(0, 60).map((n) => { n = Number(n); return isFinite(n) ? n : 0; }),
    }));
    if (!labels.length || !datasets.length || !datasets.some((d) => d.data.length)) return null;
    return { type, title: String(o.title || '').slice(0, 120), labels, datasets };
  }
  function applyTheme(ch) {
    const c = cols(), o = ch.options;
    if (o.plugins && o.plugins.legend && o.plugins.legend.labels) o.plugins.legend.labels.color = c.text;
    if (o.scales) Object.values(o.scales).forEach((sc) => { sc.ticks.color = c.text; sc.grid.color = c.grid; });
    ch.update('none');
  }
  function makeChart(canvas, spec) {
    const c = cols(), pie = spec.type === 'pie' || spec.type === 'doughnut';
    Chart.defaults.font.family = "'Sarabun','Kanit',sans-serif"; Chart.defaults.font.size = 12;
    const datasets = spec.datasets.map((d, i) => {
      const col = PAL[i % PAL.length];
      if (pie) return { label: d.label, data: d.data, backgroundColor: spec.labels.map((_, j) => PAL[j % PAL.length]), borderWidth: 0 };
      if (spec.type === 'line') return { label: d.label, data: d.data, borderColor: col, backgroundColor: col, tension: .3, pointRadius: 3, borderWidth: 2 };
      return { label: d.label, data: d.data, backgroundColor: col + 'cc', borderColor: col, borderWidth: 1, borderRadius: 6 };
    });
    const tick = { color: c.text }, grid = { color: c.grid };
    return new Chart(canvas.getContext('2d'), {
      type: spec.type, data: { labels: spec.labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 500 },
        plugins: { legend: { display: pie || datasets.length > 1, labels: { color: c.text, boxWidth: 12 } } },
        scales: pie ? {} : { x: { ticks: { ...tick }, grid: { ...grid } }, y: { ticks: { ...tick }, grid: { ...grid }, beginAtZero: true } },
      },
    });
  }
  function savePng(ch, title) {
    const src = ch.canvas, t = document.createElement('canvas'); t.width = src.width; t.height = src.height;
    const x = t.getContext('2d'); x.fillStyle = isDark() ? '#161616' : '#ffffff'; x.fillRect(0, 0, t.width, t.height); x.drawImage(src, 0, 0);
    download(t.toDataURL('image/png'), (title || 'chart').replace(/[^\wก-๙-]+/g, '_') + '.png');
  }
  function expand(spec) {
    $('vm-title').textContent = spec.title || ''; const body = $('vm-body'); body.innerHTML = '';
    const cv = h('canvas'); body.appendChild(cv); $('view-modal').classList.remove('hidden');
    vmChart = makeChart(cv, spec); charts.push(vmChart);
  }
  function closeView() {
    $('view-modal').classList.add('hidden');
    if (vmChart) { vmChart.destroy(); charts = charts.filter((c) => c !== vmChart); vmChart = null; }
    $('vm-body').innerHTML = '';
  }
  function chartCard(o) {
    const spec = cleanChart(o); if (!spec || !window.Chart) return null;
    const card = h('div', 'dcard'), head = h('div', 'dcard-h'), tools = h('div', 'dcard-tools'), body = h('div'), canvas = h('canvas');
    body.style.cssText = 'height:17rem;padding:.75rem 1rem 1rem;position:relative'; body.appendChild(canvas);
    let ch = null;
    tools.append(tool(ICON.dl, '', 'บันทึกเป็นรูป', () => ch && savePng(ch, spec.title)), tool(ICON.ex, '', 'ขยาย', () => expand(spec)));
    head.append(h('b', null, spec.title), tools); card.append(head, body);
    requestAnimationFrame(() => { if (canvas.isConnected) { ch = makeChart(canvas, spec); charts.push(ch); } });
    return card;
  }
  function statsGrid(o) {
    const arr = Array.isArray(o) ? o : o && o.items; if (!Array.isArray(arr) || !arr.length) return null;
    const g = h('div', 'stats');
    arr.slice(0, 4).forEach((x) => {
      if (!x) return; const c = h('div', 'stat');
      c.append(h('small', null, String(x.label == null ? '' : x.label)), h('strong', null, String(x.value == null ? '' : x.value)));
      if (x.change) { const t = String(x.change); c.appendChild(h('em', /^\+/.test(t) ? 'up' : /^[-−]/.test(t) ? 'down' : '', t)); }
      g.appendChild(c);
    });
    return g.children.length ? g : null;
  }
  const collator = new Intl.Collator('th', { numeric: true });
  const toNum = (t) => { const n = parseFloat(String(t).replace(/[,\s$฿%+]/g, '')); return isNaN(n) ? null : n; };
  function tableCard(table) {
    if (table.closest('.dcard') || !table.tBodies[0] || !table.tHead) return;
    const tbody = table.tBodies[0], rows = [...tbody.rows], ths = [...table.tHead.rows[0].cells];
    if (!rows.length) return;
    const card = h('div', 'dcard'), head = h('div', 'dcard-h'), tools = h('div', 'dcard-tools'), scroll = h('div', 'dcard-scroll');
    let search = null;
    if (rows.length >= 6) { search = h('input', 'dcard-search'); search.type = 'search'; search.placeholder = 'ค้นหาในตาราง'; search.setAttribute('aria-label', 'ค้นหาในตาราง'); head.appendChild(search); }
    else head.appendChild(h('span', 'muted', rows.length + ' แถว'));
    if (search) search.oninput = () => { const q = search.value.trim().toLowerCase(); rows.forEach((r) => { r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none'; }); };
    tools.appendChild(tool(ICON.dl, 'CSV', 'บันทึกเป็น CSV', () => {
      const q = (v) => '"' + v.trim().replace(/"/g, '""') + '"';
      const lines = [ths.map((c) => q(c.textContent)).join(',')].concat([...tbody.rows].map((r) => [...r.cells].map((c) => q(c.textContent)).join(',')));
      download(URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/csv;charset=utf-8' })), 'nivread-table.csv');
    }));
    head.appendChild(tools);
    ths.forEach((th, i) => {
      th.onclick = () => {
        const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
        ths.forEach((x) => delete x.dataset.dir); th.dataset.dir = dir;
        const k = dir === 'asc' ? 1 : -1;
        [...tbody.rows].sort((a, b) => {
          const x = a.cells[i].textContent, y = b.cells[i].textContent, nx = toNum(x), ny = toNum(y);
          return k * (nx !== null && ny !== null ? nx - ny : collator.compare(x, y));
        }).forEach((r) => tbody.appendChild(r));
      };
    });
    table.replaceWith(card); scroll.appendChild(table); card.append(head, scroll);
  }
  // อัปเกรดเนื้อหา markdown ที่ render แล้ว: บล็อก ```chart / ```stats และตารางทั้งหมด
  function enhance(root) {
    charts = charts.filter((c) => (c.canvas && c.canvas.isConnected) || (c.destroy(), false));
    root.querySelectorAll('pre > code').forEach((code) => {
      const m = /language-(chart|stats)/.exec(code.className); if (!m) return;
      let o; try { o = JSON.parse(code.textContent); } catch { return; }
      const el = m[1] === 'chart' ? chartCard(o) : statsGrid(o);
      if (el) code.parentElement.replaceWith(el);
    });
    root.querySelectorAll('table').forEach(tableCard);
  }
  new MutationObserver(() => charts.forEach(applyTheme)).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  function addMsg(role, text, kind) {
    if (role === 'user') stick = true;
    const row = document.createElement('div');
    row.className = 'shrink-0 ' + (role === 'user' ? 'mt-7 flex' : 'mt-6');
    const b = document.createElement('div'); b.className = 'break-words ' + BUB[kind || role];
    setText(b, kind === 'err' ? 'user' : role, text); if (role === 'assistant' && kind !== 'err' && text) enhance(b); row.appendChild(b); log.appendChild(row); scrollEnd(); return b;
  }
  // ปุ่มคัดลอกอยู่นอกเนื้อหา (ไม่ถูกเขียนทับตอน render markdown)
  function addCopy(b, text) {
    const row = b.parentElement; row.querySelector('.acts')?.remove();
    const bar = document.createElement('div'); bar.className = 'acts mt-3 -ml-2 flex items-center';
    const c = document.createElement('button'); c.type = 'button';
    c.className = 'inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs text-slate-500 dark:text-neutral-400 hover:bg-black/5 dark:hover:bg-white/10 hover:text-slate-800 dark:hover:text-white cursor-pointer';
    c.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/></svg><span>คัดลอก</span>';
    const lab = c.querySelector('span');
    c.onclick = async () => { try { await navigator.clipboard.writeText(text); lab.textContent = 'คัดลอกแล้ว'; setTimeout(() => (lab.textContent = 'คัดลอก'), 1500); } catch {} };
    bar.appendChild(c); row.appendChild(bar);
  }
  function intro() {
    const m = MODES[mode], d = document.createElement('div'); d.id = 'intro'; d.className = 'my-auto shrink-0 pb-10';
    d.innerHTML = '<h1 class="text-2xl sm:text-3xl font-medium tracking-tight"></h1><p class="mt-3 max-w-xl text-[15px] leading-relaxed text-slate-500 dark:text-neutral-400"></p><ul class="mt-8 divide-y divide-slate-200 dark:divide-white/10 border-y border-slate-200 dark:border-white/10"></ul>';
    d.querySelector('h1').textContent = m.title; d.querySelector('p').textContent = m.hi;
    const box = d.querySelector('ul');
    m.chips.forEach((t) => {
      const li = document.createElement('li'), x = document.createElement('button'); x.type = 'button'; x.textContent = t;
      x.className = 'w-full py-3.5 text-left text-[15px] text-slate-700 dark:text-neutral-200 hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer';
      x.onclick = () => { if (mode === 'docs') { input.value = t + '\n\n'; grow(); input.focus(); } else send(t); };
      li.appendChild(x); box.appendChild(li);
    });
    log.appendChild(d);
  }
  const cnt = () => { const n = input.value.length, mx = MODES[mode].max, cc = $('cc'); cc.textContent = n >= mx * 0.7 ? n.toLocaleString() + '/' + mx.toLocaleString() : ''; cc.classList.toggle('text-red-500', n >= mx); };
  const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 192) + 'px'; sync(); cnt(); };
  const sync = () => { sendBtn.disabled = busy || !input.value.trim(); };
  function showEnergy(h) {
    if (!h) return; const n = (h.free | 0) + (h.reserve | 0);
    energyEl.textContent = 'พลังงาน ' + n; energyEl.classList.toggle('text-red-500', n <= 0); energyEl.classList.toggle('text-amber-500', n > 0);
  }
  async function call(path, opt) {
    const r = await fetch(API + path + (path.includes('?') ? '&' : '?') + Q, { ...opt, headers: { 'Content-Type': 'application/json', ...H } });
    if (r.status === 401) { NIV.logout(); throw new Error('401'); }
    return r;
  }

  async function load() {
    const id = ++loadId; log.innerHTML = ''; stick = true;
    tabs.forEach((t) => t.classList.toggle('tab-on', t.dataset.tab === mode));
    input.placeholder = MODES[mode].ph; input.maxLength = MODES[mode].max; cnt();
    let msgs = [];
    try { msgs = (await (await call('/history?chat=' + mode)).json()).messages || []; } catch {}
    if (id !== loadId) return;
    if (!msgs.length) intro();
    msgs.forEach((m) => { const b = addMsg(m.role, m.content); if (m.role === 'assistant') addCopy(b, m.content); });
  }
  const setMode = (m) => {
    if (!MODES[m] || m === mode) return;
    if (ctrl) ctrl.abort();
    mode = m; history.replaceState(null, '', '#' + m); load();
  };

  async function send(text) {
    text = (text || '').trim(); if (!text || busy) return;
    $('intro')?.remove(); addMsg('user', text); input.value = ''; grow(); busy = true; sync();
    sendBtn.classList.add('hidden'); stopBtn.classList.remove('hidden');
    const bub = addMsg('assistant', '');
    bub.innerHTML = '<span class="inline-flex gap-1.5 py-2"><i class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></i><i class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse" style="animation-delay:.2s"></i><i class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse" style="animation-delay:.4s"></i></span>';
    ctrl = new AbortController();
    let reply = '', raf = 0;
    const paint = () => { raf = 0; if (reply) bub.classList.add('streaming'); setText(bub, 'assistant', reply, true); scrollEnd(); };
    const finish = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } bub.classList.remove('streaming'); setText(bub, 'assistant', reply); enhance(bub); scrollEnd(); };
    try {
      const res = await call('/chat', { method: 'POST', body: JSON.stringify({ message: text, mode }), signal: ctrl.signal });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        bub.parentElement.remove(); addMsg('assistant', d.error || 'เชื่อมต่อไม่ได้ (' + res.status + ') ลองใหม่อีกครั้ง', 'err'); return;
      }
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const evs = buf.split('\n\n'); buf = evs.pop();
        for (const ev of evs) {
          if (!ev.startsWith('data:')) continue;
          let m; try { m = JSON.parse(ev.slice(5)); } catch { continue; }
          if (m.t) { reply += m.t; if (!raf) raf = requestAnimationFrame(paint); }
          if (m.done && m.hp) showEnergy(m.hp);
        }
      }
      finish(); if (reply) addCopy(bub, reply);
    } catch (e) {
      if (e.message === '401') return;
      if (e.name === 'AbortError' && reply) { finish(); addCopy(bub, reply); }
      else { bub.parentElement.remove(); if (e.name !== 'AbortError') addMsg('assistant', 'เครือข่ายมีปัญหา ลองใหม่อีกครั้ง', 'err'); }
    } finally {
      if (raf) cancelAnimationFrame(raf);
      bub.classList.remove('streaming');
      ctrl = null; busy = false; stopBtn.classList.add('hidden'); sendBtn.classList.remove('hidden'); sync(); input.focus();
    }
  }

  // ---------- ล้างแชท ----------
  const modal = $('clr-modal'), closeModal = () => modal.classList.add('hidden');
  $('clear-btn').onclick = () => { $('clr-mode').textContent = ' “' + MODES[mode].name + '” '; modal.classList.remove('hidden'); };
  $('clr-cancel').onclick = $('clr-backdrop').onclick = closeModal;
  $('clr-ok').onclick = async () => {
    try { await call('/clear', { method: 'POST', body: JSON.stringify({ chat: mode }) }); } catch {}
    closeModal(); load();
  };

  $('back-btn').onclick = () => { if (history.length > 1 && document.referrer) history.back(); else location.href = '/'; };
  $('vm-close').onclick = $('vm-backdrop').onclick = closeView;
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeView(); closeModal(); } });
  tabs.forEach((t) => (t.onclick = () => setMode(t.dataset.tab)));
  stopBtn.onclick = () => ctrl && ctrl.abort();
  form.onsubmit = (e) => { e.preventDefault(); send(input.value); };
  input.addEventListener('input', grow);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  window.addEventListener('hashchange', () => setMode(location.hash.slice(1)));

  mode = MODES[location.hash.slice(1)] ? location.hash.slice(1) : 'general';
  load();
  call('/status').then((r) => r.json()).then((d) => showEnergy({ free: d.free, reserve: d.reserve })).catch(() => {});
})();
</script>
</body>
</html>
