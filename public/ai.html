<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI ผู้ช่วย | nivread</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/nivreadfavon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/nivreadfavon.png">
<meta name="theme-color" content="#161616">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --w: 50rem; }                       /* ความกว้างคอลัมน์อ่าน: ปรับค่าเดียวได้ทั้งหน้า */
  body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }

  /* คอลัมน์กลาง: พื้นที่เลื่อนเต็มจอ แต่เนื้อหาอยู่กลาง */
  .col { padding-left: max(1rem, calc((100% - var(--w)) / 2)); padding-right: max(1rem, calc((100% - var(--w)) / 2)); }

  /* ข้อความทั้งหมดใช้ฟอนต์อ่านยาว */
  .read { font-family: 'Sarabun', 'Kanit', sans-serif; }

  #log { overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.35) transparent; }
  #log > :first-child { margin-top: 0; }
  .no-sb { scrollbar-width: none; } .no-sb::-webkit-scrollbar { display: none; }
  .tab-on { color: #f59e0b !important; border-color: #f59e0b !important; }

  .glass-card { background: rgba(255,255,255,.95); border: 1px solid rgba(226,232,240,.8); }
  .dark .glass-card { background: #1f1f1f; border: 1px solid rgba(255,255,255,.1); }

  #main-footer, body > footer { display: none !important; }

  /* ---------- เนื้อหาตอบกลับของ AI (ไม่มีกรอบ) ---------- */
  .md { color: #1e293b; }
  .dark .md { color: #e7e5e4; }
  .md > :first-child { margin-top: 0 } .md > :last-child { margin-bottom: 0 }
  .md p { margin: .85em 0 }
  .md ul, .md ol { margin: .8em 0; padding-left: 1.5rem }
  .md ul { list-style: disc } .md ol { list-style: decimal }
  .md li { margin: .3em 0; padding-left: .2rem } .md li > ul, .md li > ol { margin: .3em 0 }
  .md li::marker { color: #94a3b8 }
  .md h1, .md h2, .md h3, .md h4 { font-family: 'Kanit', sans-serif; font-weight: 500; line-height: 1.4; margin: 1.5em 0 .5em }
  .md h1 { font-size: 1.45rem } .md h2 { font-size: 1.25rem } .md h3 { font-size: 1.1rem } .md h4 { font-size: 1rem }
  .md strong { font-weight: 600 }
  .md a { color: #d97706; text-decoration: underline; text-underline-offset: 3px }
  .md hr { border: 0; border-top: 1px solid rgba(148,163,184,.3); margin: 1.6em 0 }
  .md blockquote { margin: 1em 0; padding: .1em 0 .1em 1rem; border-left: 3px solid rgba(245,158,11,.6); color: #64748b }
  .dark .md blockquote { color: #a8a29e }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; background: rgba(148,163,184,.18); padding: .12em .4em; border-radius: .4rem }
  .md pre { margin: 1em 0; background: rgba(148,163,184,.12); border: 1px solid rgba(148,163,184,.25); padding: .9rem 1rem; border-radius: .9rem; overflow-x: auto; line-height: 1.6 }
  .md pre code { background: none; padding: 0; font-size: .85em }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; max-width: 100%; margin: 1em 0 }
  .md th, .md td { border: 1px solid rgba(148,163,184,.35); padding: .45rem .8rem; text-align: left; font-size: .95em }
  .md th { background: rgba(148,163,184,.12); font-weight: 600 }

  /* จุดเรืองแสงท้ายข้อความขณะกำลังพิมพ์ */
  .md.streaming > :last-child::after { content: ''; display: inline-block; width: .55em; height: .55em; margin-left: .35em; border-radius: 50%; background: #f59e0b; vertical-align: baseline; animation: pulse-dot 1s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity: .25; transform: scale(.8) } 50% { opacity: 1; transform: scale(1) } }

  @media (prefers-reduced-motion: reduce) { .animate-pulse, .md.streaming > :last-child::after { animation: none } }
</style>
</head>
<body class="bg-[#fafafa] text-slate-900 dark:bg-[#161616] dark:text-white h-dvh flex flex-col relative overflow-hidden">

<header id="main-header" class="z-20 shrink-0"></header>

<main class="flex-1 min-h-0 z-10 w-full flex flex-col">

  <!-- แถบบน: โหมด + พลังงาน + ล้างแชท -->
  <div class="col shrink-0 flex items-stretch gap-3 border-b border-slate-200 dark:border-white/10">
    <nav class="flex-1 min-w-0 flex overflow-x-auto no-sb -ml-3" aria-label="โหมด AI">
      <button type="button" data-tab="general" class="tab px-3 py-3 -mb-px text-sm font-medium whitespace-nowrap border-b-2 border-transparent text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-white cursor-pointer">คุยทั่วไป</button>
      <button type="button" data-tab="docs" class="tab px-3 py-3 -mb-px text-sm font-medium whitespace-nowrap border-b-2 border-transparent text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-white cursor-pointer">จัดเอกสาร</button>
      <button type="button" data-tab="fortune" class="tab px-3 py-3 -mb-px text-sm font-medium whitespace-nowrap border-b-2 border-transparent text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-white cursor-pointer">ดูดวง</button>
    </nav>
    <div class="shrink-0 flex items-center gap-4">
      <span id="energy" class="text-xs font-medium text-amber-500">พลังงาน ...</span>
      <button id="clear-btn" type="button" class="text-xs font-medium text-slate-500 dark:text-neutral-400 hover:text-red-500 cursor-pointer">ล้างแชท</button>
    </div>
  </div>

  <!-- พื้นที่ข้อความ: เลื่อนเต็มจอ ข้อความ AI ไม่มีกรอบ -->
  <div id="log" class="col read flex-1 min-h-0 overflow-y-auto flex flex-col pt-6 pb-8" aria-live="polite"></div>

  <!-- ช่องพิมพ์ลอยด้านล่าง -->
  <div class="col shrink-0 pt-2" style="padding-bottom:max(.5rem,env(safe-area-inset-bottom))">
    <form id="form" class="flex items-end gap-2 rounded-[1.75rem] border border-slate-300 dark:border-white/15 bg-white dark:bg-[#1f1f1f] pl-5 pr-2 py-2 shadow-[0_2px_12px_rgba(15,23,42,.06)] dark:shadow-none transition-colors focus-within:border-amber-500/70">
      <textarea id="input" rows="1" aria-label="ข้อความ" class="read flex-1 min-w-0 bg-transparent outline-none resize-none max-h-48 py-2 leading-relaxed placeholder:text-slate-400 dark:placeholder:text-neutral-500" style="font-size:16px"></textarea>
      <button id="stop" type="button" aria-label="หยุด" class="hidden shrink-0 w-10 h-10 rounded-full border border-slate-300 dark:border-white/20 text-slate-700 dark:text-white flex items-center justify-center hover:border-red-500 hover:text-red-500 cursor-pointer">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2"/></svg>
      </button>
      <button id="send" type="submit" aria-label="ส่ง" class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-white bg-gradient-to-br from-amber-500 to-orange-500 hover:brightness-105 disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer" disabled>
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg>
      </button>
    </form>
    <p class="mt-2 text-center text-[11px] text-slate-400 dark:text-neutral-500">AI อาจตอบผิดพลาด โปรดตรวจสอบข้อมูลสำคัญอีกครั้ง</p>
  </div>
</main>

<div id="clr-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div id="clr-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="relative glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl">
    <h2 class="text-lg font-bold">ล้างแชทโหมดนี้</h2>
    <p class="text-sm text-slate-600 dark:text-neutral-300 mt-3 leading-relaxed">ข้อความและความจำของโหมด<b id="clr-mode"></b>จะถูกลบทั้งหมด กู้คืนไม่ได้</p>
    <div class="pt-6 flex gap-3">
      <button id="clr-cancel" type="button" class="w-1/2 py-3 rounded-xl bg-slate-200 dark:bg-white/10 hover:bg-slate-300 dark:hover:bg-white/20 font-semibold text-sm cursor-pointer">ยกเลิก</button>
      <button id="clr-ok" type="button" class="w-1/2 py-3 rounded-xl bg-red-600 text-white font-semibold text-sm hover:bg-red-700 cursor-pointer">ล้างแชท</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/nivread.js"></script>
<script>
(() => {
  const s = NIV.session();
  if (!s.token || !s.userId) { location.replace('/login?redirect=/ai'); return; }
  const API = 'https://api.fnnz.art/api/ai', Q = 'app=nivread';   // ถ้า NIV มีค่า base URL ของ API อยู่แล้ว ให้ใช้ค่านั้นแทน
  const H = { Authorization: 'Bearer ' + s.token };
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send'), stopBtn = $('stop'), form = $('form'), energyEl = $('energy');

  const MODES = {
    general: { name: 'คุยทั่วไป', max: 2000, ph: 'พิมพ์ข้อความ...', title: 'ถามอะไรก็ได้', hi: 'ช่วยคิด ช่วยเขียน ช่วยอธิบาย หรือแค่คุยเล่น เรื่องที่เปลี่ยนบ่อย เช่น ข่าวและราคา จะค้นข้อมูลล่าสุดให้ก่อนตอบ',
      chips: ['ช่วยวางแผนวันนี้ให้หน่อย', 'อธิบายดอกเบี้ยทบต้นให้เข้าใจง่าย', 'ช่วยตรวจและแก้ภาษาข้อความนี้', 'แนะนำวิธีจำคำศัพท์ภาษาอังกฤษ'] },
    docs: { name: 'จัดเอกสาร', max: 8000, ph: 'วางข้อความ แล้วบอกว่าจะให้จัดอย่างไร', title: 'วางข้อความ แล้วบอกว่าจะให้ทำอะไร', hi: 'สรุป ย่อความ จัดหัวข้อ ปรับสำนวนให้เป็นทางการ หรือร่างเอกสารจากข้อมูลคร่าว ๆ วางข้อความได้ครั้งละประมาณ 8,000 ตัวอักษร (ยังไม่รองรับไฟล์แนบ)',
      chips: ['ร่างอีเมลขอเลื่อนนัดประชุมให้สุภาพ', 'จัดโน้ตประชุมเป็นรายงานพร้อมสิ่งที่ต้องทำ', 'เขียนจดหมายลากิจแบบเป็นทางการ', 'สรุปข้อความที่จะวางให้เหลือ 5 ข้อ'] },
    fortune: { name: 'ดูดวง', max: 2000, ph: 'บอกวันเกิด หรือเรื่องที่อยากรู้...', title: 'ดูดวงเพื่อความบันเทิง', hi: 'ดวงตามวันเกิด ราศี ไพ่ทาโรต์ และเลขศาสตร์ ใช้เป็นแนวคิดประกอบการตัดสินใจ ไม่ใช่คำตัดสิน',
      chips: ['ดูดวงรายวันของวันนี้', 'ดวงการงานของคนเกิดวันจันทร์', 'เปิดไพ่ทาโรต์ 3 ใบเรื่องความรัก', 'ขอเลขมงคลประจำสัปดาห์นี้'] },
  };
  const tabs = [...document.querySelectorAll('[data-tab]')];
  let mode = 'general', ctrl = null, busy = false, loadId = 0, stick = true;

  // รูปแบบข้อความ: ผู้ใช้ = กล่องเทาอ่อนชิดขวา / AI = ข้อความเต็มคอลัมน์ ไม่มีกรอบ
  const BUB = {
    user: 'ml-auto max-w-[85%] w-fit rounded-3xl bg-slate-200/70 dark:bg-white/10 px-4 py-2.5 text-[16px] leading-relaxed whitespace-pre-wrap',
    assistant: 'md w-full text-[16px] sm:text-[17px] leading-[1.85]',
    err: 'w-full border-l-2 border-red-500/70 pl-3 text-[15px] leading-relaxed text-red-500',
  };
  const nearBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  log.addEventListener('scroll', () => { stick = nearBottom(); });
  // เลื่อนตามเฉพาะตอนผู้ใช้อยู่ท้ายแชท ถ้าเลื่อนขึ้นไปอ่านจะไม่ดึงกลับ
  const scrollEnd = () => requestAnimationFrame(() => { if (stick) log.scrollTop = log.scrollHeight; });

  function setText(b, role, text) {
    if (role === 'assistant' && window.marked && window.DOMPurify) b.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
    else b.textContent = text;
  }
  function addMsg(role, text, kind) {
    if (role === 'user') stick = true;
    const row = document.createElement('div');
    row.className = 'shrink-0 ' + (role === 'user' ? 'mt-7 flex' : 'mt-6');
    const b = document.createElement('div'); b.className = 'break-words ' + BUB[kind || role];
    setText(b, kind === 'err' ? 'user' : role, text); row.appendChild(b); log.appendChild(row); scrollEnd(); return b;
  }
  // ปุ่มคัดลอกอยู่นอกเนื้อหา (ไม่ถูกเขียนทับตอน render markdown)
  function addCopy(b, text) {
    const row = b.parentElement; row.querySelector('.acts')?.remove();
    const bar = document.createElement('div'); bar.className = 'acts mt-3 -ml-2 flex items-center';
    const c = document.createElement('button'); c.type = 'button';
    c.className = 'inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-xs text-slate-500 dark:text-neutral-400 hover:bg-black/5 dark:hover:bg-white/10 hover:text-slate-800 dark:hover:text-white cursor-pointer';
    c.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M13 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/></svg><span>คัดลอก</span>';
    const lab = c.querySelector('span');
    c.onclick = async () => { try { await navigator.clipboard.writeText(text); lab.textContent = 'คัดลอกแล้ว'; setTimeout(() => (lab.textContent = 'คัดลอก'), 1500); } catch {} };
    bar.appendChild(c); row.appendChild(bar);
  }
  function intro() {
    const m = MODES[mode], d = document.createElement('div'); d.id = 'intro'; d.className = 'my-auto shrink-0 pb-10';
    d.innerHTML = '<h1 class="text-2xl sm:text-3xl font-medium tracking-tight"></h1><p class="mt-3 max-w-xl text-[15px] leading-relaxed text-slate-500 dark:text-neutral-400"></p><ul class="mt-8 divide-y divide-slate-200 dark:divide-white/10 border-y border-slate-200 dark:border-white/10"></ul>';
    d.querySelector('h1').textContent = m.title; d.querySelector('p').textContent = m.hi;
    const box = d.querySelector('ul');
    m.chips.forEach((t) => {
      const li = document.createElement('li'), x = document.createElement('button'); x.type = 'button'; x.textContent = t;
      x.className = 'w-full py-3.5 text-left text-[15px] text-slate-700 dark:text-neutral-200 hover:text-amber-600 dark:hover:text-amber-400 transition-colors cursor-pointer';
      x.onclick = () => { if (mode === 'docs') { input.value = t + '\n\n'; grow(); input.focus(); } else send(t); };
      li.appendChild(x); box.appendChild(li);
    });
    log.appendChild(d);
  }
  const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 192) + 'px'; sync(); };
  const sync = () => { sendBtn.disabled = busy || !input.value.trim(); };
  function showEnergy(h) {
    if (!h) return; const n = (h.free | 0) + (h.reserve | 0);
    energyEl.textContent = 'พลังงาน ' + n; energyEl.classList.toggle('text-red-500', n <= 0); energyEl.classList.toggle('text-amber-500', n > 0);
  }
  async function call(path, opt) {
    const r = await fetch(API + path + (path.includes('?') ? '&' : '?') + Q, { ...opt, headers: { 'Content-Type': 'application/json', ...H } });
    if (r.status === 401) { NIV.logout(); throw new Error('401'); }
    return r;
  }

  async function load() {
    const id = ++loadId; log.innerHTML = ''; stick = true;
    tabs.forEach((t) => t.classList.toggle('tab-on', t.dataset.tab === mode));
    input.placeholder = MODES[mode].ph; input.maxLength = MODES[mode].max;
    let msgs = [];
    try { msgs = (await (await call('/history?chat=' + mode)).json()).messages || []; } catch {}
    if (id !== loadId) return;
    if (!msgs.length) intro();
    msgs.forEach((m) => { const b = addMsg(m.role, m.content); if (m.role === 'assistant') addCopy(b, m.content); });
  }
  const setMode = (m) => {
    if (!MODES[m] || m === mode) return;
    if (ctrl) ctrl.abort();
    mode = m; history.replaceState(null, '', '#' + m); load();
  };

  async function send(text) {
    text = (text || '').trim(); if (!text || busy) return;
    $('intro')?.remove(); addMsg('user', text); input.value = ''; grow(); busy = true; sync();
    sendBtn.classList.add('hidden'); stopBtn.classList.remove('hidden');
    const bub = addMsg('assistant', '');
    bub.innerHTML = '<span class="inline-flex gap-1.5 py-2"><i class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></i><i class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse" style="animation-delay:.2s"></i><i class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse" style="animation-delay:.4s"></i></span>';
    ctrl = new AbortController();
    let reply = '', raf = 0;
    const paint = () => { raf = 0; if (reply) bub.classList.add('streaming'); setText(bub, 'assistant', reply); scrollEnd(); };
    const finish = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } bub.classList.remove('streaming'); setText(bub, 'assistant', reply); scrollEnd(); };
    try {
      const res = await call('/chat', { method: 'POST', body: JSON.stringify({ message: text, mode }), signal: ctrl.signal });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        bub.parentElement.remove(); addMsg('assistant', d.error || 'เชื่อมต่อไม่ได้ (' + res.status + ') ลองใหม่อีกครั้ง', 'err'); return;
      }
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const evs = buf.split('\n\n'); buf = evs.pop();
        for (const ev of evs) {
          if (!ev.startsWith('data:')) continue;
          let m; try { m = JSON.parse(ev.slice(5)); } catch { continue; }
          if (m.t) { reply += m.t; if (!raf) raf = requestAnimationFrame(paint); }
          if (m.done && m.hp) showEnergy(m.hp);
        }
      }
      finish(); if (reply) addCopy(bub, reply);
    } catch (e) {
      if (e.message === '401') return;
      if (e.name === 'AbortError' && reply) { finish(); addCopy(bub, reply); }
      else { bub.parentElement.remove(); if (e.name !== 'AbortError') addMsg('assistant', 'เครือข่ายมีปัญหา ลองใหม่อีกครั้ง', 'err'); }
    } finally {
      if (raf) cancelAnimationFrame(raf);
      bub.classList.remove('streaming');
      ctrl = null; busy = false; stopBtn.classList.add('hidden'); sendBtn.classList.remove('hidden'); sync(); input.focus();
    }
  }

  // ---------- ล้างแชท ----------
  const modal = $('clr-modal'), closeModal = () => modal.classList.add('hidden');
  $('clear-btn').onclick = () => { $('clr-mode').textContent = ' “' + MODES[mode].name + '” '; modal.classList.remove('hidden'); };
  $('clr-cancel').onclick = $('clr-backdrop').onclick = closeModal;
  $('clr-ok').onclick = async () => {
    try { await call('/clear', { method: 'POST', body: JSON.stringify({ chat: mode }) }); } catch {}
    closeModal(); load();
  };

  tabs.forEach((t) => (t.onclick = () => setMode(t.dataset.tab)));
  stopBtn.onclick = () => ctrl && ctrl.abort();
  form.onsubmit = (e) => { e.preventDefault(); send(input.value); };
  input.addEventListener('input', grow);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  window.addEventListener('hashchange', () => setMode(location.hash.slice(1)));

  mode = MODES[location.hash.slice(1)] ? location.hash.slice(1) : 'general';
  load();
  call('/status').then((r) => r.json()).then((d) => showEnergy({ free: d.free, reserve: d.reserve })).catch(() => {});
})();
</script>
</body>
</html>
