<script src="/nivread.js"></script>
<script>
  const { session, api, el } = NIV;
  const s = session();
  if (!s.token || !s.userId) location.replace('/login?redirect=/write');

  const $ = (id) => document.getElementById(id);
  const msg = (text, kind) => {
    const m = $('message');
    m.replaceChildren();
    m.className = 'text-sm font-medium min-h-[1.25rem] ' +
      (kind === 'ok' ? 'text-emerald-600 dark:text-emerald-400' : kind === 'err' ? 'text-rose-600 dark:text-rose-400' : 'text-amber-600 dark:text-amber-400');
    if (text) m.append(text);
    return m;
  };
  const needLogin = () => { NIV.logout && location.replace('/login?redirect=/write'); };

  $('content').addEventListener('input', () => { $('count').textContent = $('content').value.length + ' / 20000'; });

  // ---------- วิดีโอ YouTube (ช่องเดียว วางได้หลายลิงก์ สูงสุด 15) ----------
  // ---------- รูปภาพ (ช่องเดียว วางได้หลายลิงก์ สูงสุด 10) ----------
  const IMG_MAX = 10;
  let images = [];
  const UP_MAX = 3;
  let uploading = false;
  const isUp = (u) => u.includes('/api/blog/img/u/');
  const upCount = () => images.filter(isUp).length;
  const imgMsg = (t, bad) => { const m = $('img-msg'); m.textContent = t; m.className = 'text-xs mt-1 ' + (bad ? 'text-rose-600 dark:text-rose-400' : 'text-slate-500 dark:text-neutral-400'); };
  function renderImages() {
    const ul = $('img-list'); ul.replaceChildren();
    images.forEach((u, i) => {
      const li = el('li', 'relative rounded-xl overflow-hidden bg-slate-200 dark:bg-black/40 border border-slate-200 dark:border-white/10 aspect-square group');
      const im = el('img', 'w-full h-full object-cover'); im.src = u; im.alt = ''; im.loading = 'lazy'; im.referrerPolicy = 'no-referrer';
      im.addEventListener('error', () => { im.classList.add('opacity-20'); });
      const tag = el('span', 'absolute left-1.5 top-1.5 px-1.5 rounded-md bg-black/60 text-white text-[11px] font-semibold', i === 0 ? 'ปก' : String(i + 1));
      const bar = el('div', 'absolute inset-x-0 bottom-0 flex justify-end gap-1 p-1 bg-gradient-to-t from-black/70 to-transparent');
      const mk = (label, text, fn, dis) => { const b = el('button', 'w-7 h-7 rounded-lg text-sm text-white bg-black/40 hover:bg-amber-500 disabled:opacity-30 disabled:hover:bg-black/40', text); b.type = 'button'; b.title = label; b.setAttribute('aria-label', label); b.disabled = !!dis; b.addEventListener('click', fn); return b; };
      const swap = (a, b) => { [images[a], images[b]] = [images[b], images[a]]; renderImages(); };
      bar.append(mk('เลื่อนไปก่อน', '←', () => swap(i, i - 1), i === 0), mk('เลื่อนไปหลัง', '→', () => swap(i, i + 1), i === images.length - 1), mk('ลบ', '✕', () => { images.splice(i, 1); renderImages(); imgMsg(''); }));
      li.append(im, tag, bar); ul.append(li);
    });
    $('img-count').textContent = images.length + ' / ' + IMG_MAX;
    $('img-input').disabled = $('img-add').disabled = images.length >= IMG_MAX;
    $('up-count').textContent = upCount() + ' / ' + UP_MAX;
    $('img-up').disabled = uploading || upCount() >= UP_MAX || images.length >= IMG_MAX;
    if (images.length >= IMG_MAX) imgMsg('ครบ 10 รูปแล้ว');
  }
  function addImages() {
    const parts = $('img-input').value.split(/[\s,]+/).filter(Boolean);
    if (!parts.length) return;
    let added = 0, bad = 0, dup = 0, over = 0, gifBad = 0;
    for (const p of parts) {
      if (!/^https:\/\/[^\s"'<>]{4,500}$/.test(p)) { bad++; continue; }
      if (/\.gif$/i.test(p.split(/[?#]/)[0]) && !/^https:\/\/([a-z0-9-]+\.)*(giphy|tenor)\.com\//i.test(p)) { gifBad++; continue; }
      if (images.includes(p)) { dup++; continue; }
      if (images.length >= IMG_MAX) { over++; continue; }
      images.push(p); added++;
    }
    $('img-input').value = '';
    renderImages();
    const notes = [];
    if (added) notes.push('เพิ่มแล้ว ' + added + ' รูป');
    if (bad) notes.push(bad + ' ลิงก์ไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://)');
    if (gifBad) notes.push(gifBad + ' GIF ไม่ได้มาจาก GIPHY / Tenor');
    if (dup) notes.push(dup + ' ซ้ำ');
    if (over) notes.push(over + ' เกินจำนวนสูงสุด');
    if (notes.length) imgMsg(notes.join(' · '), bad || over || gifBad);
  }
  // ---------- อัปโหลดรูป: บีบในเบราว์เซอร์ (WebP, ด้านยาวสุด 1600px) แล้วค่อยส่งขึ้น R2 ----------
  const TARGET = 480 * 1024;
  const loadBitmap = async (file) => {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch {}
    return await new Promise((ok, no) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); ok(im); }; im.onerror = () => { URL.revokeObjectURL(url); no(new Error('bad')); }; im.src = url;
    });
  };
  const toBlob = (cv, type, q) => new Promise((ok) => cv.toBlob(ok, type, q));
  async function compress(file) {
    const bmp = await loadBitmap(file);
    const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
    let scale = Math.min(1, 1600 / Math.max(w0, h0));
    let best = null;
    for (let round = 0; round < 4; round++) {
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(w0 * scale)); cv.height = Math.max(1, Math.round(h0 * scale));
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
      for (const q of [0.86, 0.78, 0.7, 0.62]) {
        let b = await toBlob(cv, 'image/webp', q);
        if (!b || b.type !== 'image/webp') { // เบราว์เซอร์ที่ไม่รองรับ WebP: ใช้ JPEG (พื้นขาวแทนโปร่งใส)
          const c2 = document.createElement('canvas'); c2.width = cv.width; c2.height = cv.height;
          const x2 = c2.getContext('2d'); x2.fillStyle = '#fff'; x2.fillRect(0, 0, c2.width, c2.height); x2.drawImage(cv, 0, 0);
          b = await toBlob(c2, 'image/jpeg', q);
        }
        if (!b) throw new Error('compress');
        best = b;
        if (b.size <= TARGET) return best;
      }
      scale *= 0.8; // ยังใหญ่อยู่ → ลดขนาดภาพลงอีกนิด
    }
    return best;
  }
  // ด่านแรกในเบราว์เซอร์: ตรวจภาพลามกด้วย nsfwjs (โหลดครั้งแรกตอนกดอัปโหลด ถ้าโหลด/ตรวจไม่ได้จะข้ามไป — ด่านจริงอยู่ที่เซิร์ฟเวอร์)
  const loadScript = (src) => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  let nsfwP = null;
  const nsfwModel = () => nsfwP || (nsfwP = (async () => {
    const B = 'https://cdn.jsdelivr.net/npm/nsfwjs@4.2.1/dist/';
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js');
    await loadScript(B + 'models/mobilenet_v2/model.min.js');
    await loadScript(B + 'models/mobilenet_v2/group1-shard1of1.min.js');
    await loadScript(B + 'browser/nsfwjs.min.js');
    return await window.nsfwjs.load();
  })().catch(() => null));
  async function looksNsfw(blob) {
    try {
      const m = await Promise.race([nsfwModel(), new Promise((r) => setTimeout(() => r(null), 12000))]);
      if (!m) return false;
      const url = URL.createObjectURL(blob), im = new Image();
      im.src = url; await im.decode();
      const pr = await m.classify(im); URL.revokeObjectURL(url);
      const g = (n) => (pr.find((x) => x.className === n) || {}).probability || 0;
      return g('Porn') >= 0.6 || g('Hentai') >= 0.75;
    } catch { return false; }
  }
  async function uploadFiles(files) {
    if (uploading) return;
    const list = [...files];
    if (!list.length) return;
    uploading = true; renderImages();
    let done = 0; const notes = []; let bad = false;
    for (const f of list) {
      if (upCount() >= UP_MAX || images.length >= IMG_MAX) { notes.push('เกินจำนวนที่อัปโหลดได้'); bad = true; break; }
      if (f.type === 'image/gif') { notes.push('GIF ให้วางเป็นลิงก์แทน'); bad = true; continue; }
      if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { notes.push(f.name + ' ไม่ใช่รูป JPG/PNG/WebP'); bad = true; continue; }
      imgMsg('กำลังบีบและอัปโหลด ' + (done + 1) + '/' + list.length + ' ...');
      try {
        const blob = await compress(f);
        if (blob.size > 1400000) throw new Error('big');
        if (await looksNsfw(blob)) { notes.push(f.name + ' ไม่ผ่านการตรวจสอบเนื้อหา (ไม่อนุญาตภาพลามก)'); bad = true; continue; }
        const r = await fetch(NIV.API + '/api/blog/upload?userId=' + encodeURIComponent(s.userId), {
          method: 'POST', headers: { Authorization: 'Bearer ' + s.token, 'Content-Type': blob.type }, body: blob,
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || !d.success) { notes.push(d.error || 'อัปโหลดไม่สำเร็จ'); bad = true; if (r.status === 401) needLogin(); continue; }
        images.push(d.url); done++; renderImages();
      } catch { notes.push(f.name + ': ประมวลผลรูปไม่ได้'); bad = true; }
    }
    uploading = false; renderImages();
    if (done) notes.unshift('อัปโหลดแล้ว ' + done + ' รูป');
    imgMsg(notes.join(' · ') || 'ไม่มีรูปที่อัปโหลด', bad);
  }
  $('img-up').addEventListener('click', () => { nsfwModel(); $('img-file').click(); }); // เริ่มโหลดโมเดลตรวจภาพรอไว้
  $('img-file').addEventListener('change', (e) => { const f = e.target.files; uploadFiles(f).finally(() => { e.target.value = ''; }); });

  const toggle = (btn, pn, focus) => {
    const open = $(pn).classList.contains('hidden');
    $(pn).classList.toggle('hidden', !open);
    $(btn).setAttribute('aria-pressed', open ? 'true' : 'false');
    if (open) $(focus).focus();
  };
  $('tg-img').addEventListener('click', () => toggle('tg-img', 'pn-img', 'img-input'));
  $('tg-yt').addEventListener('click', () => toggle('tg-yt', 'pn-yt', 'yt-input'));

  $('img-add').addEventListener('click', addImages);
  $('img-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addImages(); } });
  $('img-input').addEventListener('paste', () => setTimeout(addImages, 0));

  const YT_MAX = 15;
  let videos = [];
  const VID_UP_MAX = 2, VID_SEC = 30;
  let vidBusy = false;
  const ytId = (raw) => {
    const t = String(raw || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t;
    let u; try { u = new URL(/^https?:\/\//i.test(t) ? t : 'https://' + t); } catch { return null; }
    const h = u.hostname.replace(/^(www|m|music)\./, '');
    let id = null;
    if (h === 'youtu.be') id = u.pathname.split('/')[1];
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?#]+)/); if (m) id = m[1]; }
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  };
  const ytMsg = (t, bad) => { const m = $('yt-msg'); m.textContent = t; m.className = 'text-xs mt-1 ' + (bad ? 'text-rose-600 dark:text-rose-400' : 'text-slate-500 dark:text-neutral-400'); };
  const isVidUp = (u) => /\/api\/blog\/vid\/v\//.test(String(u));
  function renderVideos() {
    const ul = $('yt-list'); ul.replaceChildren();
    videos.forEach((id, i) => {
      const li = el('li', 'flex items-center gap-3 p-2 rounded-xl bg-slate-100 dark:bg-black/30 border border-slate-200 dark:border-white/10');
      const img = el('img', 'w-24 aspect-video rounded-lg object-cover shrink-0 bg-black'); img.src = isVidUp(id) ? id.replace(/\.(mp4|webm)$/, '.jpg') : 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg'; if (isVidUp(id)) img.referrerPolicy = 'no-referrer-when-downgrade'; img.alt = ''; img.loading = 'lazy';
      const info = el('div', 'min-w-0 flex-1');
      info.append(el('div', 'text-sm font-semibold', 'วิดีโอที่ ' + (i + 1)), el('div', 'text-xs text-slate-500 dark:text-neutral-400 truncate', isVidUp(id) ? 'วิดีโอที่อัปโหลด' : 'youtu.be/' + id));
      const mk = (label, text, fn, dis) => { const b = el('button', 'w-8 h-8 rounded-lg text-sm text-slate-500 dark:text-neutral-300 hover:bg-amber-500/15 hover:text-amber-500 disabled:opacity-30 disabled:hover:bg-transparent', text); b.type = 'button'; b.title = label; b.setAttribute('aria-label', label); b.disabled = !!dis; b.addEventListener('click', fn); return b; };
      const swap = (a, b) => { [videos[a], videos[b]] = [videos[b], videos[a]]; renderVideos(); };
      li.append(img, info,
        mk('เลื่อนขึ้น', '↑', () => swap(i, i - 1), i === 0),
        mk('เลื่อนลง', '↓', () => swap(i, i + 1), i === videos.length - 1),
        mk('ลบ', '✕', () => { videos.splice(i, 1); renderVideos(); ytMsg(''); }));
      ul.append(li);
    });
    $('yt-count').textContent = videos.length + ' / ' + YT_MAX;
    $('vid-count').textContent = videos.filter(isVidUp).length + ' / ' + VID_UP_MAX;
    $('vid-up').disabled = vidBusy || videos.filter(isVidUp).length >= VID_UP_MAX || videos.length >= YT_MAX;
    $('yt-input').disabled = $('yt-add').disabled = videos.length >= YT_MAX;
    if (videos.length >= YT_MAX) ytMsg('ครบ 15 คลิปแล้ว');
  }
  function addVideos() {
    const parts = $('yt-input').value.split(/[\s,]+/).filter(Boolean);
    if (!parts.length) return;
    let added = 0, bad = 0, dup = 0, over = 0;
    for (const p of parts) {
      const id = ytId(p);
      if (!id) { bad++; continue; }
      if (videos.includes(id)) { dup++; continue; }
      if (videos.length >= YT_MAX) { over++; continue; }
      videos.push(id); added++;
    }
    $('yt-input').value = '';
    renderVideos();
    const notes = [];
    if (added) notes.push('เพิ่มแล้ว ' + added + ' คลิป');
    if (bad) notes.push(bad + ' ลิงก์ไม่ใช่ YouTube');
    if (dup) notes.push(dup + ' ซ้ำ');
    if (over) notes.push(over + ' เกินจำนวนสูงสุด');
    if (notes.length) ytMsg(notes.join(' · '), bad || over);
  }
  $('yt-add').addEventListener('click', addVideos);
  $('yt-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addVideos(); } });
  $('yt-input').addEventListener('paste', () => setTimeout(addVideos, 0));


  // ---------- อัปโหลดวิดีโอ (เฉพาะบัญชีที่แอดมินอนุญาต · ไม่เกิน 30 วินาที · บีบในเบราว์เซอร์ก่อนส่ง) ----------
  api('/api/blog/me?userId=' + encodeURIComponent(s.userId)).then((r) => {
    if (r.ok && r.data.canVideo) { $('vid-up').classList.remove('hidden'); renderVideos(); }
  }).catch(() => {});
  const waitEv = (t, ok, bad = 'error') => new Promise((res, rej) => { t.addEventListener(ok, res, { once: true }); t.addEventListener(bad, () => rej(new Error('media')), { once: true }); });
  const jpegOf = (src, w, h, maxW) => new Promise((res) => {
    const k = Math.min(1, maxW / w), c = document.createElement('canvas');
    c.width = Math.max(2, Math.round(w * k)); c.height = Math.max(2, Math.round(h * k));
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    c.toBlob(res, 'image/jpeg', 0.75);
  });
  // เล่นวิดีโอลง canvas แล้วอัดใหม่ด้วย MediaRecorder (ย่อด้านยาวสุด 1280px, ~2.2Mbps) — ใช้เวลาเท่าความยาวคลิป
  async function compressVideo(file, onProg) {
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) throw new Error('unsupported');
    const objUrl = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.playsInline = true; v.preload = 'auto'; v.src = objUrl;
    let ac = null, rec = null;
    try {
      await waitEv(v, 'loadedmetadata');
      if (!isFinite(v.duration)) { v.currentTime = 1e7; await waitEv(v, 'timeupdate'); v.currentTime = 0; } // ไฟล์ที่ไม่มีข้อมูลความยาว (เช่น WebM จากตัวอัด) ให้เบราว์เซอร์คำนวณเอง
      const dur = v.duration;
      if (!isFinite(dur) || dur <= 0) throw new Error('media');
      if (dur > VID_SEC + 0.5) throw new Error('long');
      const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
      const W = Math.max(2, Math.round(v.videoWidth * k / 2) * 2), H = Math.max(2, Math.round(v.videoHeight * k / 2) * 2);
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const stream = cv.captureStream(30);
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
        const dest = ac.createMediaStreamDestination();
        ac.createMediaElementSource(v).connect(dest); // ไม่ต่อลำโพง = ไม่มีเสียงดังขณะบีบ
        dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
      } catch {}
      const mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
        .find((m) => MediaRecorder.isTypeSupported(m));
      if (!mime) throw new Error('unsupported');
      // เป้า bitrate = ค่าต่ำสุดของ: (1) ที่ความละเอียดนี้ควรใช้ (~0.06 bit/พิกเซล/เฟรม) (2) 70% ของต้นฉบับ (ให้เล็กลงจริง) (3) เพดานไม่ให้ไฟล์เกิน 11MB
      const srcBps = file.size * 8 / Math.max(dur, 1);
      const bppBps = W * H * 30 * 0.06;
      const fitBps = Math.floor((11e6 * 8 / Math.max(dur, 1)) * 0.9) - 100000;
      const vbps = Math.floor(Math.max(400000, Math.min(2200000, bppBps, srcBps * 0.7, fitBps)));
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: vbps, audioBitsPerSecond: 96000 });
      const chunks = []; rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const stopped = new Promise((res) => { rec.onstop = res; });
      const marks = [Math.min(0.5, dur * 0.05), dur * 0.5, dur * 0.9], frames = [];
      let last = performance.now();
      const draw = async () => {
        ctx.drawImage(v, 0, 0, W, H);
        last = performance.now();
        onProg && onProg(Math.min(1, v.currentTime / dur));
        while (marks.length && v.currentTime >= marks[0]) { marks.shift(); const f = await jpegOf(cv, W, H, 960); if (f) frames.push(f); }
      };
      const loop = () => { if (v.ended || v.paused && v.currentTime >= dur) return; draw(); (v.requestVideoFrameCallback ? v.requestVideoFrameCallback.bind(v) : requestAnimationFrame)(loop); };
      rec.start(1000);
      await v.play();
      loop();
      await Promise.race([
        waitEv(v, 'ended'),
        new Promise((_, rej) => { const t = setInterval(() => { if (performance.now() - last > 15000) { clearInterval(t); rej(new Error('stall')); } if (v.ended) clearInterval(t); }, 1000); }),
      ]);
      await draw();
      if (!frames.length) { const f = await jpegOf(cv, W, H, 960); if (f) frames.push(f); }
      if (rec.state !== 'inactive') rec.stop();
      await stopped;
      const blob = new Blob(chunks, { type: mime.split(';')[0] });
      console.info('[compressVideo]', { mime, size: W + 'x' + H, dur: +dur.toFixed(1), srcMB: +(file.size / 1048576).toFixed(2), outMB: +(blob.size / 1048576).toFixed(2),
        srcMbps: +(file.size * 8 / dur / 1e6).toFixed(2), targetMbps: +(vbps / 1e6).toFixed(2), outMbps: +(blob.size * 8 / dur / 1e6).toFixed(2) });
      return { blob, frames, duration: dur };
    } finally {
      try { if (rec && rec.state !== 'inactive') rec.stop(); } catch {}
      try { v.pause(); } catch {}
      if (ac) ac.close().catch(() => {});
      URL.revokeObjectURL(objUrl);
    }
  }
  $('vid-up').addEventListener('click', () => $('vid-file').click());
  $('vid-file').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f || vidBusy) return;
    if (!/^video\//.test(f.type)) return ytMsg('เลือกไฟล์วิดีโอเท่านั้น', true);
    vidBusy = true; renderVideos();
    try {
      const { blob: recBlob, frames, duration } = await compressVideo(f, (p) => ytMsg('กำลังบีบวิดีโอ ' + Math.round(p * 100) + '% (ห้ามปิดหน้านี้)'));
      // ผลบีบอัดไม่เล็กกว่าต้นฉบับ (และต้นฉบับเป็น mp4/webm อยู่แล้ว) → ใช้ต้นฉบับ ไม่ให้ไฟล์ใหญ่ขึ้น
      const blob = (/^video\/(mp4|webm)$/.test(f.type) && f.size < recBlob.size) ? f : recBlob;
      if (blob.size > 12e6) throw new Error('big');
      ytMsg('กำลังอัปโหลด ' + (blob.size / 1048576).toFixed(1) + ' MB ...');
      const fd = new FormData();
      fd.append('video', blob, 'v.' + (blob.type.includes('mp4') ? 'mp4' : 'webm'));
      fd.append('duration', String(Math.min(duration, 30.9).toFixed(2)));
      frames.slice(0, 3).forEach((fr, i) => fd.append('frame', fr, 'f' + i + '.jpg'));
      const r = await fetch(NIV.API + '/api/blog/video-upload?userId=' + encodeURIComponent(s.userId), { method: 'POST', headers: { Authorization: 'Bearer ' + s.token }, body: fd });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.success) { ytMsg(d.error || 'อัปโหลดวิดีโอไม่สำเร็จ', true); if (r.status === 401) needLogin(); }
      else { videos.push(d.url); ytMsg('อัปโหลดวิดีโอแล้ว'); }
    } catch (err) {
      const m = String(err && err.message);
      ytMsg(m === 'long' ? 'วิดีโอยาวเกิน 30 วินาที' : m === 'big' ? 'บีบแล้วไฟล์ยังใหญ่เกินไป ลองคลิปที่สั้นลง' : m === 'unsupported' ? 'เบราว์เซอร์นี้ยังบีบวิดีโอไม่ได้ (ลองใช้ Chrome หรือ Safari รุ่นใหม่)' : 'ประมวลผลวิดีโอไม่ได้ (ไฟล์อาจเสียหรือรูปแบบไม่รองรับ)', true);
    } finally { vidBusy = false; renderVideos(); }
  });

  $('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('submit-btn').disabled = true;
    msg(editSlug ? 'กำลังบันทึก...' : 'กำลังส่งโพสต์...');
    try {
      const r = await api(editSlug ? '/api/blog/update' : '/api/blog/create', {
        method: 'POST',
        body: {
          userId: s.userId,
          ...(editSlug ? { slug: editSlug } : {}),
          title: $('title').value,
          category: $('category').value,
          images,
          content: $('content').value,
          videos,
        },
      });
      if (r.status === 401) return needLogin();
      if (!r.ok) return msg(r.data.error || 'ส่งโพสต์ไม่สำเร็จ', 'err');

      if (editSlug) {
        const m = msg('', 'ok');
        const a = el('a', 'font-semibold', 'เปิดดูโพสต์');
        a.href = '/posts/' + editSlug;
        const back = el('a', 'font-semibold ml-3', 'โพสต์ของฉัน'); back.href = NIV.userUrl(s.userId);
        m.append('บันทึกการแก้ไขแล้ว' + (r.data.edits_left == null ? ' ' : ` (เหลือแก้ไขได้อีก ${r.data.edits_left} ครั้ง) `), a, back);
        if (r.data.edits_left === 0) { $('submit-btn').classList.add('hidden'); [...$('post-form').elements].forEach((x) => { if (x.id !== 'submit-btn') x.disabled = true; }); }
        return;
      }
      $('post-form').reset();
      images = []; renderImages(); imgMsg('');
      videos = []; renderVideos(); ytMsg('');
      $('count').textContent = '0 / 20000';
      if (r.data.status === 'published') { location.href = '/posts?r=' + Date.now(); return; } // ไปหน้าโพสต์ (?r= กันแคชเก่า ให้เห็นโพสต์ใหม่ทันที)
      if (false) {
        const m = msg('', 'ok');
        const a = el('a', 'font-semibold', 'เปิดดูโพสต์');
        a.href = '/posts/' + r.data.slug;
        const back = el('a', 'font-semibold ml-3', 'โพสต์ของฉัน'); back.href = NIV.userUrl(s.userId);
        m.append('เผยแพร่แล้ว ', a, back);
      } else {
        msg('ส่งโพสต์แล้ว', 'ok');
      }
    } catch {
      msg('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่', 'err');
    } finally {
      $('submit-btn').disabled = false;
    }
  });

  // ---------- โหมดแก้ไข: /write?edit=<slug> ----------
  const editSlug = new URLSearchParams(location.search).get('edit') || '';
  async function loadEdit() {
    if (!editSlug) return;
    $('page-h').textContent = 'แก้ไขโพสต์';
    $('submit-label').textContent = 'บันทึกการแก้ไข';
    $('cancel-edit').classList.remove('hidden'); $('cancel-edit').href = NIV.userUrl(s.userId);
    msg('กำลังโหลดโพสต์...');
    const r = await api('/api/blog/edit-get?userId=' + encodeURIComponent(s.userId) + '&slug=' + encodeURIComponent(editSlug));
    if (r.status === 401) return needLogin();
    if (!r.ok) { msg(r.data.error || 'โหลดโพสต์ไม่สำเร็จ', 'err'); $('submit-btn').disabled = true; return; }
    const p = r.data.post;
    $('title').value = p.title || '';
    $('category').value = p.category || '';
    images = Array.isArray(p.images) ? p.images.slice(0, IMG_MAX) : []; renderImages();
    $('content').value = p.content || '';
    videos = Array.isArray(p.videos) ? p.videos.slice(0, YT_MAX) : []; renderVideos();
    $('count').textContent = $('content').value.length + ' / 20000';
    const left = r.data.edits_left;
    $('page-sub').textContent = left == null ? 'แอดมินแก้ไขได้ไม่จำกัด' : `แก้ไขโพสต์ได้ไม่เกิน 2 ครั้ง — เหลืออีก ${left} ครั้ง`;
    if (left === 0) {
      msg('โพสต์นี้แก้ไขครบ 2 ครั้งแล้ว', 'err');
      $('submit-btn').classList.add('hidden');
      [...$('post-form').elements].forEach((x) => { x.disabled = true; });
    } else msg('');
  }

  // ---------- หมวดหมู่ที่เคยมีผู้ใช้ใส่ (พิมพ์แล้วแนะนำให้เลือก เช่น พิมพ์ ani → anime, การ์ → การ์ตูน) ----------
  let allCats = [];
  let sugIdx = -1;
  const sug = $('cat-sug'), catIn = $('category');
  const norm = (t) => String(t).toLowerCase().replace(/\s+/g, ' ').trim();
  function hideSug() { sug.classList.add('hidden'); catIn.setAttribute('aria-expanded', 'false'); sugIdx = -1; }
  function pickCat(name) { catIn.value = name; hideSug(); }
  function showSug() {
    const q = norm(catIn.value.replace(/^#+/, ''));
    if (!q) return hideSug();
    // ขึ้นต้นด้วยคำที่พิมพ์ก่อน แล้วค่อยตามด้วยที่มีคำนั้นอยู่ตรงกลาง
    const starts = allCats.filter((c) => norm(c.name).startsWith(q));
    const has = allCats.filter((c) => !norm(c.name).startsWith(q) && norm(c.name).includes(q));
    const found = [...starts, ...has].slice(0, 8);
    sug.replaceChildren();
    found.forEach((c) => {
      const li = el('li', 'flex items-center justify-between gap-3 px-4 py-2 text-sm cursor-pointer hover:bg-amber-500/10 aria-selected:bg-amber-500/15');
      li.setAttribute('role', 'option');
      li.append(el('span', 'truncate', c.name), el('span', 'text-xs text-slate-400 shrink-0', c.n + ' โพสต์'));
      li.addEventListener('mousedown', (e) => { e.preventDefault(); pickCat(c.name); });
      sug.append(li);
    });
    const exact = allCats.some((c) => norm(c.name) === q);
    if (!exact) {
      const li = el('li', 'px-4 py-2 text-sm cursor-pointer text-amber-600 dark:text-amber-400 hover:bg-amber-500/10 aria-selected:bg-amber-500/15');
      li.setAttribute('role', 'option'); li.dataset.new = '1';
      li.textContent = 'สร้างหมวดใหม่ "' + catIn.value.replace(/^#+/, '').trim() + '"';
      li.addEventListener('mousedown', (e) => { e.preventDefault(); pickCat(catIn.value.replace(/^#+/, '').replace(/\s+/g, ' ').trim()); });
      sug.append(li);
    }
    sugIdx = -1;
    sug.classList.remove('hidden'); catIn.setAttribute('aria-expanded', 'true');
  }
  catIn.addEventListener('input', showSug);
  catIn.addEventListener('focus', showSug);
  catIn.addEventListener('blur', () => setTimeout(hideSug, 120));
  catIn.addEventListener('keydown', (e) => {
    const items = [...sug.children];
    if (sug.classList.contains('hidden') || !items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sugIdx = (sugIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((li, i) => li.setAttribute('aria-selected', i === sugIdx ? 'true' : 'false'));
      items[sugIdx].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && sugIdx >= 0) {
      e.preventDefault();
      items[sugIdx].dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true }));
    } else if (e.key === 'Escape') hideSug();
  });

  (async () => {
    try {
      const r = await api('/api/blog/categories');
      const cats = (r.ok && r.data.categories) || [];
      allCats = cats;
    } catch {}
  })();

  renderImages();
  renderVideos();
  loadEdit();
</script>
