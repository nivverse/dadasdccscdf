<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>เขียนโพสต์ | nivread</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/nivreadfavon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/nivreadfavon.png">
<meta name="theme-color" content="#0d0d0d">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Kanit',sans-serif}</style>
</head>
<body class="bg-[#f3f4f6] text-slate-900 dark:bg-[#0d0d0d] dark:text-white min-h-screen flex flex-col relative overflow-x-hidden">

<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
  <div class="absolute top-1/2 -right-40 w-96 h-96 bg-orange-500/20 opacity-30 dark:opacity-100 rounded-full blur-[128px]"></div>
</div>

<header id="main-header" class="z-20"></header>

<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 py-6 z-10">
  <h1 id="page-h" class="text-3xl font-extrabold tracking-tight">เขียนโพสต์</h1>
  <p id="page-sub" class="text-sm text-slate-600 dark:text-neutral-400 mt-1">โพสต์ของคุณจะแสดงบนหน้าโพสต์และค้นหาได้บน Google ทันทีหลังกดส่ง</p>

  <form id="post-form" class="mt-6 rounded-2xl bg-white/85 dark:bg-white/5 border border-slate-200 dark:border-white/10 backdrop-blur-md shadow-sm p-4 sm:p-6 space-y-5">
    <div>
      <label for="title" class="block text-sm font-medium mb-1.5">หัวข้อ</label>
      <input id="title" required minlength="5" maxlength="120" placeholder="หัวข้อที่บอกได้ชัดว่าโพสต์นี้เกี่ยวกับอะไร"
        class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
    </div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label for="category" class="block text-sm font-medium mb-1.5">หมวดหมู่ <span class="text-slate-400 font-normal">(ไม่บังคับ)</span></label>
        <input id="category" maxlength="40" placeholder="เช่น ข่าวอนิเมะ รีวิว"
          class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
      </div>
      <div>
        <label for="cover" class="block text-sm font-medium mb-1.5">ลิงก์รูปปก <span class="text-slate-400 font-normal">(ไม่บังคับ)</span></label>
        <input id="cover" type="url" maxlength="500" placeholder="https://..."
          class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
      </div>
    </div>
    <div>
      <div class="flex justify-between items-end mb-1.5">
        <label for="content" class="block text-sm font-medium">เนื้อหา</label>
        <span id="count" class="text-xs text-slate-400">0 / 20000</span>
      </div>
      <textarea id="content" rows="14" required minlength="50" maxlength="20000" placeholder="เว้นบรรทัดว่างหนึ่งบรรทัดเพื่อขึ้นย่อหน้าใหม่"
        class="w-full px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm leading-7 focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20"></textarea>
      <p class="text-xs text-slate-500 dark:text-neutral-400 mt-1">เนื้อหาเป็นข้อความล้วน ยาวอย่างน้อย 50 ตัวอักษร</p>
    </div>

    <div>
      <div class="flex justify-between items-end mb-1.5">
        <label for="yt-input" class="block text-sm font-medium">วิดีโอ YouTube <span class="text-slate-400 font-normal">(ไม่บังคับ)</span></label>
        <span id="yt-count" class="text-xs text-slate-400">0 / 15</span>
      </div>
      <div class="flex gap-2">
        <input id="yt-input" type="text" inputmode="url" autocomplete="off" placeholder="วางลิงก์ YouTube ได้ครั้งละหลายลิงก์"
          class="min-w-0 flex-1 px-4 py-3 rounded-xl bg-slate-100 dark:bg-black/40 border border-slate-300 dark:border-white/10 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
        <button id="yt-add" type="button" class="shrink-0 px-4 rounded-xl bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/40 text-sm font-semibold hover:bg-amber-500/25 transition">เพิ่ม</button>
      </div>
      <p id="yt-msg" class="text-xs mt-1 text-slate-500 dark:text-neutral-400" role="status">รองรับ youtube.com/watch, youtu.be, shorts — สูงสุด 15 คลิป</p>
      <ul id="yt-list" class="mt-3 space-y-2"></ul>
    </div>

    <div id="message" class="text-sm font-medium min-h-[1.25rem]" role="status"></div>

    <button id="submit-btn" type="submit"
      class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-semibold shadow-md shadow-amber-500/25 transition disabled:opacity-60">
      <span id="submit-label">โพสต์เลย</span>
    </button>
    <a id="cancel-edit" href="/posts" class="hidden ml-3 text-sm text-slate-500 dark:text-neutral-400 hover:opacity-70">ยกเลิกการแก้ไข</a>
  </form>

</main>

<div id="main-footer" class="z-10"></div>
<script src="/nivread.js"></script>
<script>
  const { session, api, el } = NIV;
  const s = session();
  if (!s.token || !s.userId) location.replace('/login?redirect=/write');

  const $ = (id) => document.getElementById(id);
  const msg = (text, kind) => {
    const m = $('message');
    m.replaceChildren();
    m.className = 'text-sm font-medium min-h-[1.25rem] ' +
      (kind === 'ok' ? 'text-emerald-600 dark:text-emerald-400' : kind === 'err' ? 'text-rose-600 dark:text-rose-400' : 'text-amber-600 dark:text-amber-400');
    if (text) m.append(text);
    return m;
  };
  const needLogin = () => { NIV.logout && location.replace('/login?redirect=/write'); };

  $('content').addEventListener('input', () => { $('count').textContent = $('content').value.length + ' / 20000'; });

  // ---------- วิดีโอ YouTube (ช่องเดียว วางได้หลายลิงก์ สูงสุด 15) ----------
  const YT_MAX = 15;
  let videos = [];
  const ytId = (raw) => {
    const t = String(raw || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(t)) return t;
    let u; try { u = new URL(/^https?:\/\//i.test(t) ? t : 'https://' + t); } catch { return null; }
    const h = u.hostname.replace(/^(www|m|music)\./, '');
    let id = null;
    if (h === 'youtu.be') id = u.pathname.split('/')[1];
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
      if (u.pathname === '/watch') id = u.searchParams.get('v');
      else { const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([^/?#]+)/); if (m) id = m[1]; }
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  };
  const ytMsg = (t, bad) => { const m = $('yt-msg'); m.textContent = t; m.className = 'text-xs mt-1 ' + (bad ? 'text-rose-600 dark:text-rose-400' : 'text-slate-500 dark:text-neutral-400'); };
  function renderVideos() {
    const ul = $('yt-list'); ul.replaceChildren();
    videos.forEach((id, i) => {
      const li = el('li', 'flex items-center gap-3 p-2 rounded-xl bg-slate-100 dark:bg-black/30 border border-slate-200 dark:border-white/10');
      const img = el('img', 'w-24 aspect-video rounded-lg object-cover shrink-0 bg-black'); img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg'; img.alt = ''; img.loading = 'lazy';
      const info = el('div', 'min-w-0 flex-1');
      info.append(el('div', 'text-sm font-semibold', 'วิดีโอที่ ' + (i + 1)), el('div', 'text-xs text-slate-500 dark:text-neutral-400 truncate', 'youtu.be/' + id));
      const mk = (label, text, fn, dis) => { const b = el('button', 'w-8 h-8 rounded-lg text-sm text-slate-500 dark:text-neutral-300 hover:bg-amber-500/15 hover:text-amber-500 disabled:opacity-30 disabled:hover:bg-transparent', text); b.type = 'button'; b.title = label; b.setAttribute('aria-label', label); b.disabled = !!dis; b.addEventListener('click', fn); return b; };
      const swap = (a, b) => { [videos[a], videos[b]] = [videos[b], videos[a]]; renderVideos(); };
      li.append(img, info,
        mk('เลื่อนขึ้น', '↑', () => swap(i, i - 1), i === 0),
        mk('เลื่อนลง', '↓', () => swap(i, i + 1), i === videos.length - 1),
        mk('ลบ', '✕', () => { videos.splice(i, 1); renderVideos(); ytMsg(''); }));
      ul.append(li);
    });
    $('yt-count').textContent = videos.length + ' / ' + YT_MAX;
    $('yt-input').disabled = $('yt-add').disabled = videos.length >= YT_MAX;
    if (videos.length >= YT_MAX) ytMsg('ครบ 15 คลิปแล้ว');
  }
  function addVideos() {
    const parts = $('yt-input').value.split(/[\s,]+/).filter(Boolean);
    if (!parts.length) return;
    let added = 0, bad = 0, dup = 0, over = 0;
    for (const p of parts) {
      const id = ytId(p);
      if (!id) { bad++; continue; }
      if (videos.includes(id)) { dup++; continue; }
      if (videos.length >= YT_MAX) { over++; continue; }
      videos.push(id); added++;
    }
    $('yt-input').value = '';
    renderVideos();
    const notes = [];
    if (added) notes.push('เพิ่มแล้ว ' + added + ' คลิป');
    if (bad) notes.push(bad + ' ลิงก์ไม่ใช่ YouTube');
    if (dup) notes.push(dup + ' ซ้ำ');
    if (over) notes.push(over + ' เกินจำนวนสูงสุด');
    if (notes.length) ytMsg(notes.join(' · '), bad || over);
  }
  $('yt-add').addEventListener('click', addVideos);
  $('yt-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addVideos(); } });
  $('yt-input').addEventListener('paste', () => setTimeout(addVideos, 0));

  $('post-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('submit-btn').disabled = true;
    msg(editSlug ? 'กำลังบันทึก...' : 'กำลังส่งโพสต์...');
    try {
      const r = await api(editSlug ? '/api/blog/update' : '/api/blog/create', {
        method: 'POST',
        body: {
          userId: s.userId,
          ...(editSlug ? { slug: editSlug } : {}),
          title: $('title').value,
          category: $('category').value,
          coverUrl: $('cover').value,
          content: $('content').value,
          videos,
        },
      });
      if (r.status === 401) return needLogin();
      if (!r.ok) return msg(r.data.error || 'ส่งโพสต์ไม่สำเร็จ', 'err');

      if (editSlug) {
        const m = msg('', 'ok');
        const a = el('a', 'font-semibold', 'เปิดดูโพสต์');
        a.href = '/posts/' + editSlug;
        const back = el('a', 'font-semibold ml-3', 'โพสต์ของฉัน'); back.href = NIV.userUrl(s.userId);
        m.append('บันทึกการแก้ไขแล้ว' + (r.data.edits_left == null ? ' ' : ` (เหลือแก้ไขได้อีก ${r.data.edits_left} ครั้ง) `), a, back);
        if (r.data.edits_left === 0) { $('submit-btn').classList.add('hidden'); [...$('post-form').elements].forEach((x) => { if (x.id !== 'submit-btn') x.disabled = true; }); }
        return;
      }
      $('post-form').reset();
      videos = []; renderVideos(); ytMsg('รองรับ youtube.com/watch, youtu.be, shorts — สูงสุด 15 คลิป');
      $('count').textContent = '0 / 20000';
      if (r.data.status === 'published') {
        const m = msg('', 'ok');
        const a = el('a', 'font-semibold', 'เปิดดูโพสต์');
        a.href = '/posts/' + r.data.slug;
        const back = el('a', 'font-semibold ml-3', 'โพสต์ของฉัน'); back.href = NIV.userUrl(s.userId);
        m.append('เผยแพร่แล้ว ', a, back);
      } else {
        msg('ส่งโพสต์แล้ว', 'ok');
      }
    } catch {
      msg('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่', 'err');
    } finally {
      $('submit-btn').disabled = false;
    }
  });

  // ---------- โหมดแก้ไข: /write?edit=<slug> ----------
  const editSlug = new URLSearchParams(location.search).get('edit') || '';
  async function loadEdit() {
    if (!editSlug) return;
    $('page-h').textContent = 'แก้ไขโพสต์';
    $('submit-label').textContent = 'บันทึกการแก้ไข';
    $('cancel-edit').classList.remove('hidden'); $('cancel-edit').href = NIV.userUrl(s.userId);
    msg('กำลังโหลดโพสต์...');
    const r = await api('/api/blog/edit-get?userId=' + encodeURIComponent(s.userId) + '&slug=' + encodeURIComponent(editSlug));
    if (r.status === 401) return needLogin();
    if (!r.ok) { msg(r.data.error || 'โหลดโพสต์ไม่สำเร็จ', 'err'); $('submit-btn').disabled = true; return; }
    const p = r.data.post;
    $('title').value = p.title || '';
    $('category').value = p.category || '';
    $('cover').value = p.cover_url || '';
    $('content').value = p.content || '';
    videos = Array.isArray(p.videos) ? p.videos.slice(0, YT_MAX) : []; renderVideos();
    $('count').textContent = $('content').value.length + ' / 20000';
    const left = r.data.edits_left;
    $('page-sub').textContent = left == null ? 'แอดมินแก้ไขได้ไม่จำกัด' : `แก้ไขโพสต์ได้ไม่เกิน 2 ครั้ง — เหลืออีก ${left} ครั้ง`;
    if (left === 0) {
      msg('โพสต์นี้แก้ไขครบ 2 ครั้งแล้ว', 'err');
      $('submit-btn').classList.add('hidden');
      [...$('post-form').elements].forEach((x) => { x.disabled = true; });
    } else msg('');
  }

  renderVideos();
  loadEdit();
</script>
</body>
</html>
