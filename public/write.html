<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เขียนโพสต์ | nivread (ดีไซน์)</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111;--mute:#8a8d93;--line:#e6e7ea;--card:#fff;--shadow:0 6px 14px rgba(0,0,0,.08);--amber:#f59e0b;--amber-bg:rgba(245,158,11,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--fg:#f5f5f5;--mute:#8d9096;--line:#2a2a2a;--card:#171717;--shadow:0 6px 14px rgba(0,0,0,.5)}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Kanit',sans-serif;background:var(--bg);color:var(--fg)}
.page{max-width:640px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.bar b{font-weight:600;font-size:17px}
.x{width:36px;height:36px;border:0;background:none;color:var(--fg);font-size:22px;cursor:pointer}
.go{border:0;border-radius:999px;padding:8px 20px;font:500 15px 'Kanit',sans-serif;color:#fff;background:linear-gradient(90deg,#f59e0b,#f97316);cursor:pointer}
.chips{display:flex;gap:10px;padding:6px 16px 0;overflow-x:auto;scrollbar-width:none}
.chip{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1.5px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:9px 16px;font:400 15px 'Kanit',sans-serif;cursor:pointer}
.chip svg{width:20px;height:20px}
.chip small{color:var(--mute);font-size:13px}
.write{flex:1;display:flex;flex-direction:column;padding:18px 16px 0;min-height:0}
.title{width:100%;border:0;outline:0;background:none;color:var(--fg);font:500 26px/1.35 'Kanit',sans-serif;padding:0 0 12px;border-bottom:1px solid var(--line)}
.desc{flex:1;width:100%;border:0;outline:0;resize:none;background:none;color:var(--fg);font:300 20px/1.8 'Kanit',sans-serif;padding:14px 0}
.title::placeholder,.desc::placeholder{color:var(--mute)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding-bottom:10px}
.tray{display:flex;gap:12px;overflow-x:auto;padding:6px 16px 16px;scrollbar-width:none}
.tool{flex:0 0 auto;width:92px;height:84px;border:0;border-radius:18px;background:var(--card);color:var(--fg);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:400 14px 'Kanit',sans-serif;cursor:pointer;border:1.5px solid transparent}
.tool svg{width:26px;height:26px}
.tool em{font-style:normal;font-size:11px;color:var(--mute)}
.tool[aria-pressed=true]{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.chip:focus-visible,.tool:focus-visible,.go:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <button class="x" aria-label="ปิด">✕</button>
    <b>เขียนโพสต์</b>
    <button class="go">โพสต์เลย</button>
  </div>

  <div class="chips">
    <button class="chip" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor"/></svg>
      หมวดหมู่ <small>(ไม่บังคับ)</small>
    </button>
  </div>

  <div class="write">
    <input class="title" id="t" maxlength="120" placeholder="หัวข้อที่บอกได้ชัดว่าโพสต์นี้เกี่ยวกับอะไร...">
    <textarea class="desc" id="d" maxlength="20000" placeholder="เขียนคำอธิบายหรือเนื้อหาโพสต์... เว้นบรรทัดว่างหนึ่งบรรทัดเพื่อขึ้นย่อหน้าใหม่"></textarea>
    <div class="meta"><span>ข้อความล้วน อย่างน้อย 50 ตัวอักษร</span><span id="c">0 / 20000</span></div>
  </div>

  <div class="tray" role="group" aria-label="เพิ่มในโพสต์">
    <button class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>อัปโหลดรูป<em>0 / 3</em></button>
    <button class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.07 0l3-3a5 5 0 00-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 00-7.07 0l-3 3a5 5 0 007.07 7.07l1.5-1.5"/></svg>ลิงก์/GIF<em>0 / 10</em></button>
    <button class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9.5v5l4.5-2.5z"/></svg>YouTube<em>0 / 15</em></button>
    <button class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="3"/></svg>วิดีโอ<em>0 / 1</em></button>
    <button class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>กล่องล็อก<em>0 / 5</em></button>
    <button class="tool" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3a9 9 0 019 9"/></svg>เสียง<em>0 / 1</em></button>
  </div>
</div>
<script>
document.getElementById('d').addEventListener('input',e=>{document.getElementById('c').textContent=e.target.value.length+' / 20000'});
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')));
</script>
</body>
</html>
