<!DOCTYPE html>
<html lang="th" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI ผู้ช่วย | nivread</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/img/nivreadfavon.png" type="image/png">
<link rel="apple-touch-icon" href="/img/nivreadfavon.png">
<meta name="theme-color" content="#0d0d0d">
<script>
  if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
  else document.documentElement.classList.add('dark');
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
  .glass-card { background: rgba(255,255,255,.88); backdrop-filter: blur(16px); border: 1px solid rgba(226,232,240,.8); box-shadow: 0 10px 25px -5px rgba(15,23,42,.08); }
  .dark .glass-card { background: rgba(18,18,18,.82); border: 1px solid rgba(255,255,255,.1); box-shadow: none; }
  .fld { width: 100%; padding: .75rem 1rem; border-radius: .75rem; background: #f1f5f9; border: 1px solid #e2e8f0; outline: none; }
  .dark .fld { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); }
  .fld:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.2); }
  .btn-main { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .75rem 1.5rem; border-radius: .75rem; font-size: .875rem; font-weight: 600; color: #fff; background: linear-gradient(to right,#f59e0b,#f97316); cursor: pointer; }
  .btn-main:hover { filter: brightness(1.08); }
  .btn-main:disabled { opacity: .5; cursor: not-allowed; }
  .tab-on { color: #f59e0b !important; border-color: #f59e0b !important; }
  #log { overscroll-behavior: contain; }
  .md > :first-child { margin-top: 0 } .md > :last-child { margin-bottom: 0 }
  .md p, .md ul, .md ol { margin: .5em 0 } .md ul { list-style: disc; padding-left: 1.3rem } .md ol { list-style: decimal; padding-left: 1.3rem }
  .md h1, .md h2, .md h3 { font-weight: 600; margin: .9em 0 .3em } .md h1 { font-size: 1.15rem } .md h2 { font-size: 1.05rem }
  .md table { display: block; overflow-x: auto; border-collapse: collapse; max-width: 100% }
  .md th, .md td { border: 1px solid rgba(148,163,184,.4); padding: .3rem .6rem; text-align: left }
  .md pre { background: rgba(148,163,184,.15); padding: .7rem; border-radius: .6rem; overflow-x: auto }
  .md a { color: #f59e0b; text-decoration: underline }
  @media (prefers-reduced-motion: reduce) { .animate-pulse { animation: none } }
</style>
</head>
<body class="bg-[#f3f4f6] text-slate-900 dark:bg-[#0d0d0d] dark:text-white h-dvh flex flex-col relative overflow-hidden">

<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/25 opacity-40 dark:opacity-100 rounded-full blur-[128px]"></div>
  <div class="absolute top-1/2 -right-40 w-96 h-96 bg-orange-500/25 opacity-40 dark:opacity-100 rounded-full blur-[128px]"></div>
</div>

<header id="main-header" class="z-20 shrink-0"></header>

<main class="flex-1 min-h-0 z-10 w-full max-w-3xl mx-auto px-3 sm:px-6 py-3 sm:py-6 flex">
  <section class="glass-card rounded-3xl w-full min-h-0 flex flex-col overflow-hidden">
    <nav class="shrink-0 flex overflow-x-auto border-b border-slate-200 dark:border-white/10 px-2" aria-label="โหมด AI">
      <button type="button" data-tab="general" class="tab px-4 py-3.5 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-white cursor-pointer">คุยทั่วไป</button>
      <button type="button" data-tab="docs" class="tab px-4 py-3.5 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-white cursor-pointer">จัดเอกสาร</button>
      <button type="button" data-tab="fortune" class="tab px-4 py-3.5 text-sm font-semibold whitespace-nowrap border-b-2 border-transparent text-slate-500 dark:text-neutral-400 hover:text-slate-800 dark:hover:text-white cursor-pointer">ดูดวง</button>
    </nav>

    <div class="shrink-0 flex items-center justify-between gap-3 px-4 sm:px-6 py-2.5 border-b border-slate-200 dark:border-white/10">
      <span id="energy" class="text-xs font-semibold text-amber-500">พลังงาน ...</span>
      <button id="clear-btn" type="button" class="text-xs font-medium text-slate-500 dark:text-neutral-400 hover:text-red-500 cursor-pointer">ล้างแชท</button>
    </div>

    <div id="log" class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 space-y-4" aria-live="polite"></div>

    <form id="form" class="shrink-0 border-t border-slate-200 dark:border-white/10 p-3 sm:p-4 flex items-end gap-2" style="padding-bottom:max(.75rem,env(safe-area-inset-bottom))">
      <textarea id="input" rows="1" aria-label="ข้อความ" class="fld flex-1 resize-none max-h-36" style="font-size:16px"></textarea>
      <button id="stop" type="button" class="hidden shrink-0 px-4 py-3 rounded-xl border border-red-500 text-red-500 text-sm font-semibold cursor-pointer">หยุด</button>
      <button id="send" type="submit" class="btn-main shrink-0" disabled>ส่ง</button>
    </form>
  </section>
</main>

<div id="clr-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div id="clr-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
  <div class="relative glass-card w-full max-w-sm rounded-3xl p-6 shadow-2xl">
    <h2 class="text-lg font-bold">ล้างแชทโหมดนี้</h2>
    <p class="text-sm text-slate-600 dark:text-neutral-300 mt-3 leading-relaxed">ข้อความและความจำของโหมด<b id="clr-mode"></b>จะถูกลบทั้งหมด กู้คืนไม่ได้</p>
    <div class="pt-6 flex gap-3">
      <button id="clr-cancel" type="button" class="w-1/2 py-3 rounded-xl bg-slate-200 dark:bg-white/10 hover:bg-slate-300 dark:hover:bg-white/20 font-semibold text-sm cursor-pointer">ยกเลิก</button>
      <button id="clr-ok" type="button" class="w-1/2 py-3 rounded-xl bg-red-600 text-white font-semibold text-sm hover:bg-red-700 cursor-pointer">ล้างแชท</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="/nivread.js"></script>
<script>
(() => {
  const s = NIV.session();
  if (!s.token || !s.userId) { location.replace('/login?redirect=/ai'); return; }
  const API = 'https://api.fnnz.art/api/ai', Q = 'app=nivread';   // ถ้า NIV มีค่า base URL ของ API อยู่แล้ว ให้ใช้ค่านั้นแทน
  const H = { Authorization: 'Bearer ' + s.token };
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send'), stopBtn = $('stop'), form = $('form'), energyEl = $('energy');

  const MODES = {
    general: { name: 'คุยทั่วไป', max: 2000, ph: 'พิมพ์ข้อความ...', title: 'ถามอะไรก็ได้', hi: 'ช่วยคิด ช่วยเขียน ช่วยอธิบาย หรือแค่คุยเล่น เรื่องที่เปลี่ยนบ่อย เช่น ข่าวและราคา จะค้นข้อมูลล่าสุดให้ก่อนตอบ',
      chips: ['ช่วยวางแผนวันนี้ให้หน่อย', 'อธิบายดอกเบี้ยทบต้นให้เข้าใจง่าย', 'ช่วยตรวจและแก้ภาษาข้อความนี้', 'แนะนำวิธีจำคำศัพท์ภาษาอังกฤษ'] },
    docs: { name: 'จัดเอกสาร', max: 8000, ph: 'วางข้อความ แล้วบอกว่าจะให้จัดอย่างไร', title: 'วางข้อความ แล้วบอกว่าจะให้ทำอะไร', hi: 'สรุป ย่อความ จัดหัวข้อ ปรับสำนวนให้เป็นทางการ หรือร่างเอกสารจากข้อมูลคร่าว ๆ วางข้อความได้ครั้งละประมาณ 8,000 ตัวอักษร (ยังไม่รองรับไฟล์แนบ)',
      chips: ['ร่างอีเมลขอเลื่อนนัดประชุมให้สุภาพ', 'จัดโน้ตประชุมเป็นรายงานพร้อมสิ่งที่ต้องทำ', 'เขียนจดหมายลากิจแบบเป็นทางการ', 'สรุปข้อความที่จะวางให้เหลือ 5 ข้อ'] },
    fortune: { name: 'ดูดวง', max: 2000, ph: 'บอกวันเกิด หรือเรื่องที่อยากรู้...', title: 'ดูดวงเพื่อความบันเทิง', hi: 'ดวงตามวันเกิด ราศี ไพ่ทาโรต์ และเลขศาสตร์ ใช้เป็นแนวคิดประกอบการตัดสินใจ ไม่ใช่คำตัดสิน',
      chips: ['ดูดวงรายวันของวันนี้', 'ดวงการงานของคนเกิดวันจันทร์', 'เปิดไพ่ทาโรต์ 3 ใบเรื่องความรัก', 'ขอเลขมงคลประจำสัปดาห์นี้'] },
  };
  const tabs = [...document.querySelectorAll('[data-tab]')];
  let mode = 'general', ctrl = null, busy = false, loadId = 0;

  const BUB = {
    user: 'bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl rounded-br-md whitespace-pre-wrap',
    assistant: 'bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-2xl rounded-bl-md md',
    err: 'border border-dashed border-slate-300 dark:border-white/15 text-red-500 rounded-2xl rounded-bl-md',
  };
  const scrollEnd = () => requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
  function setText(b, role, text) {
    if (role === 'assistant' && window.marked && window.DOMPurify) b.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
    else b.textContent = text;
  }
  function addMsg(role, text, kind) {
    const row = document.createElement('div'); row.className = 'flex ' + (role === 'user' ? 'justify-end' : '');
    const b = document.createElement('div'); b.className = 'max-w-[88%] sm:max-w-[80%] px-4 py-2.5 text-[15px] leading-relaxed break-words ' + BUB[kind || role];
    setText(b, kind === 'err' ? 'user' : role, text); row.appendChild(b); log.appendChild(row); scrollEnd(); return b;
  }
  function addCopy(b, text) {
    const c = document.createElement('button'); c.type = 'button'; c.textContent = 'คัดลอก';
    c.className = 'block mt-2 text-xs text-slate-400 hover:text-amber-500 cursor-pointer';
    c.onclick = async () => { try { await navigator.clipboard.writeText(text); c.textContent = 'คัดลอกแล้ว'; setTimeout(() => (c.textContent = 'คัดลอก'), 1500); } catch {} };
    b.appendChild(c);
  }
  function intro() {
    const m = MODES[mode], d = document.createElement('div'); d.id = 'intro'; d.className = 'py-2';
    d.innerHTML = '<h1 class="text-xl font-bold"></h1><p class="mt-1 mb-4 text-sm text-slate-500 dark:text-neutral-400 max-w-lg leading-relaxed"></p><div class="flex flex-wrap gap-2"></div>';
    d.querySelector('h1').textContent = m.title; d.querySelector('p').textContent = m.hi;
    const box = d.querySelector('div');
    m.chips.forEach((t) => {
      const x = document.createElement('button'); x.type = 'button'; x.textContent = t;
      x.className = 'px-3 py-2 rounded-xl border border-slate-300 dark:border-white/15 text-sm text-left hover:border-amber-500 transition-colors cursor-pointer';
      x.onclick = () => { if (mode === 'docs') { input.value = t + '\n\n'; grow(); input.focus(); } else send(t); };
      box.appendChild(x);
    });
    log.appendChild(d);
  }
  const grow = () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 144) + 'px'; sync(); };
  const sync = () => { sendBtn.disabled = busy || !input.value.trim(); };
  function showEnergy(h) {
    if (!h) return; const n = (h.free | 0) + (h.reserve | 0);
    energyEl.textContent = 'พลังงาน ' + n; energyEl.classList.toggle('text-red-500', n <= 0); energyEl.classList.toggle('text-amber-500', n > 0);
  }
  async function call(path, opt) {
    const r = await fetch(API + path + (path.includes('?') ? '&' : '?') + Q, { ...opt, headers: { 'Content-Type': 'application/json', ...H } });
    if (r.status === 401) { NIV.logout(); throw new Error('401'); }
    return r;
  }

  async function load() {
    const id = ++loadId; log.innerHTML = '';
    tabs.forEach((t) => t.classList.toggle('tab-on', t.dataset.tab === mode));
    input.placeholder = MODES[mode].ph; input.maxLength = MODES[mode].max;
    let msgs = [];
    try { msgs = (await (await call('/history?chat=' + mode)).json()).messages || []; } catch {}
    if (id !== loadId) return;
    if (!msgs.length) intro();
    msgs.forEach((m) => { const b = addMsg(m.role, m.content); if (m.role === 'assistant') addCopy(b, m.content); });
  }
  const setMode = (m) => {
    if (!MODES[m] || m === mode) return;
    if (ctrl) ctrl.abort();
    mode = m; history.replaceState(null, '', '#' + m); load();
  };

  async function send(text) {
    text = (text || '').trim(); if (!text || busy) return;
    $('intro')?.remove(); addMsg('user', text); input.value = ''; grow(); busy = true; sync();
    sendBtn.classList.add('hidden'); stopBtn.classList.remove('hidden');
    const bub = addMsg('assistant', '');
    bub.innerHTML = '<span class="inline-flex gap-1 py-1"><i class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse"></i><i class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse" style="animation-delay:.2s"></i><i class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-pulse" style="animation-delay:.4s"></i></span>';
    ctrl = new AbortController();
    let reply = '', raf = 0;
    const paint = () => { raf = 0; setText(bub, 'assistant', reply); scrollEnd(); };
    try {
      const res = await call('/chat', { method: 'POST', body: JSON.stringify({ message: text, mode }), signal: ctrl.signal });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        bub.parentElement.remove(); addMsg('assistant', d.error || 'เชื่อมต่อไม่ได้ (' + res.status + ') ลองใหม่อีกครั้ง', 'err'); return;
      }
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const evs = buf.split('\n\n'); buf = evs.pop();
        for (const ev of evs) {
          if (!ev.startsWith('data:')) continue;
          let m; try { m = JSON.parse(ev.slice(5)); } catch { continue; }
          if (m.t) { reply += m.t; if (!raf) raf = requestAnimationFrame(paint); }
          if (m.done && m.hp) showEnergy(m.hp);
        }
      }
      paint(); if (reply) addCopy(bub, reply);
    } catch (e) {
      if (e.message === '401') return;
      if (e.name === 'AbortError' && reply) { paint(); addCopy(bub, reply); }
      else { bub.parentElement.remove(); if (e.name !== 'AbortError') addMsg('assistant', 'เครือข่ายมีปัญหา ลองใหม่อีกครั้ง', 'err'); }
    } finally {
      ctrl = null; busy = false; stopBtn.classList.add('hidden'); sendBtn.classList.remove('hidden'); sync(); input.focus();
    }
  }

  // ---------- ล้างแชท ----------
  const modal = $('clr-modal'), closeModal = () => modal.classList.add('hidden');
  $('clear-btn').onclick = () => { $('clr-mode').textContent = ' “' + MODES[mode].name + '” '; modal.classList.remove('hidden'); };
  $('clr-cancel').onclick = $('clr-backdrop').onclick = closeModal;
  $('clr-ok').onclick = async () => {
    try { await call('/clear', { method: 'POST', body: JSON.stringify({ chat: mode }) }); } catch {}
    closeModal(); load();
  };

  tabs.forEach((t) => (t.onclick = () => setMode(t.dataset.tab)));
  stopBtn.onclick = () => ctrl && ctrl.abort();
  form.onsubmit = (e) => { e.preventDefault(); send(input.value); };
  input.addEventListener('input', grow);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
  window.addEventListener('hashchange', () => setMode(location.hash.slice(1)));

  mode = MODES[location.hash.slice(1)] ? location.hash.slice(1) : 'general';
  load();
  call('/status').then((r) => r.json()).then((d) => showEnergy({ free: d.free, reserve: d.reserve })).catch(() => {});
})();
</script>
</body>
</html>
